<script>
// Version of this page, shown small next to the title. Bump it on EVERY publish (v1 -> v2 -> ...).
const PAGE_VERSION="v1";
// The owner of the book, as the page names them. Cards whose "von" is anything but "Claude" belong to the owner,
// whatever older data calls them.
const OWNER_NAME="Eigner";
