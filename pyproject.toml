# What pip needs to install this, and nothing more.
#
# The module name carries an underscore because a hyphen cannot be
# imported; the project name keeps the hyphen, which is what somebody
# types. Both are the same name to pip.
#
# The version is spelled the way pip spells it, here and in the
# program and on the tag. "3.0.0-beta" would be accepted and then
# written down as "3.0.0b0" anyway, and two spellings of one version
# is a thing to get wrong for no gain.
#
# The two packages are named here, so that pip brings them along. The
# way in is the window, and a window that cannot open on the first
# start because something is missing is not a way in. It costs the
# wait once, at installing, rather than at the moment somebody wants
# to work.
#
# No versions are pinned, the same as requirements.txt: nothing here
# needs a particular one, and a pin that nobody measured only goes
# stale.
#
# ffmpeg and ffprobe are not in here and cannot be: they are not
# Python. The program looks for them and says where to get them.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "videopodcast-magic"
version = "3.0.0b8"
description = "Raw material from a video podcast becomes an edited episode"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy",     # the measuring: the cameras onto one time axis
    "PySide6",   # the window, and the player in it
    "certifi",   # what an https connection is checked against
    "faster-whisper",   # speech recognition, used as soon as a transcript is
    # The speaker separation, and it is not an extra: cutting by who is
    # speaking is what this program is for. It brings torch and
    # torchvision with it, so an installation is some 828 MB rather than
    # a few -- measured 4.9.2026, torch alone 536 MB.
    #
    # It stands here rather than in a folder of its own so that one
    # command repairs everything. A separate environment is out of
    # pip's reach: a package removed from it by hand stays removed, and
    # "pip3 install -U" does not notice. That is not a story -- it
    # happened on 4.9.2026, torchvision went, and the program answered
    # with a sentence about telemetry that had nothing to do with it.
    "pyannote.audio",
    # Named although pyannote pulls it in anyway. torchmetrics imports
    # its image half eagerly, so without torchvision "import
    # pyannote.audio" dies at a name it never uses. Naming it here means
    # a repair is one command and not a diagnosis.
    "torchvision",
]

# gui-scripts, not scripts. On macOS and Linux the two produce a
# starter that is byte for byte the same; on Windows this one builds an
# .exe with no console window behind the interface, and starts it with
# pythonw. Measured by reading the PE header of both: subsystem 2
# against 3.
[project.gui-scripts]
videopodcast-magic = "videopodcast_magic:main"

[tool.setuptools]
# The program is a folder, and every piece of it is a folder in it. All
# of them are named: setuptools ships packages, not stray directories,
# so each piece needs its own __init__.py and its own name here, or an
# installed copy speaks English only and opens no window.
#
# models/ is deliberately absent -- 31 MB of speaker model that the
# program fetches when it is first needed. Naming it would put that
# weight into every installation, for the many who never separate
# speakers.
#
# player/, fittings/, tables/, menus/, filelist/ and prework/ are the
# six the way in never fetches: all six are asked for from inside
# ui/__init__.py, player/ again from fittings/ and fittings/ again from
# filelist/.
# text_german_arrives reads the way in and no other file, so it cannot
# see them; source_piece_list_holds walks the beside() calls in every
# piece and does. Measured 6.9.2026 on a copy, one name off the list at
# a time: without "videopodcast_magic.player" source_piece_list_holds
# goes red and names the call site it read the folder from
# (fittings/__init__.py line 41) while text_german_arrives stays green,
# "videopodcast_magic.filelist" the same from ui/__init__.py line 1366,
# and "videopodcast_magic.speech", which the way in fetches itself,
# turns both of them red. No name comes off this list quietly any more.
#
# orders/ stood among them until build_argument_parser moved into it
# the same day and the way in began to read it as well: measured on a
# broken copy, "videopodcast_magic.orders" off this list left
# text_german_arrives green before that move and turned it red after.
packages = [
    "videopodcast_magic",
    "videopodcast_magic.auphonic",
    "videopodcast_magic.bearings",
    "videopodcast_magic.choices",
    "videopodcast_magic.cut",
    "videopodcast_magic.desktop",
    "videopodcast_magic.dials",
    "videopodcast_magic.filelist",
    "videopodcast_magic.filing",
    "videopodcast_magic.fittings",
    "videopodcast_magic.hearing",
    "videopodcast_magic.herald",
    "videopodcast_magic.language",
    "videopodcast_magic.livery",
    "videopodcast_magic.logbook",
    "videopodcast_magic.material",
    "videopodcast_magic.menus",
    "videopodcast_magic.metadata",
    "videopodcast_magic.orders",
    "videopodcast_magic.pipeline",
    "videopodcast_magic.player",
    "videopodcast_magic.preflight",
    "videopodcast_magic.prework",
    "videopodcast_magic.resolve",
    "videopodcast_magic.setup",
    "videopodcast_magic.soundings",
    "videopodcast_magic.speakers",
    "videopodcast_magic.speech",
    "videopodcast_magic.stowage",
    "videopodcast_magic.tables",
    "videopodcast_magic.timecode",
    "videopodcast_magic.ui",
    "videopodcast_magic.upkeep",
]

# The nine translations are data, not program, and setuptools ships
# only Python out of a package unless it is told otherwise. Without
# this line the wheel carries the reader and no texts, and an
# installed copy speaks English only -- measured 5.9.2026: zero .po
# files in the wheel, and nothing said about it anywhere.
#
# The program's picture is the second of them, and the same line is
# what carries it: without this the shortcut laid on the first start
# shows the system's blank sheet, and nothing says why.
[tool.setuptools.package-data]
"videopodcast_magic.desktop" = ["*.png"]
"videopodcast_magic.language" = ["*.po"]
