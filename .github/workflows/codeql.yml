name: codeql

# GitHub's own code scanning over the Python, tried once on the owner's
# word. By hand and once a week, never on a push: the seven checks a
# merge waits for stay seven, and what this finds lands under Security.
run-name: "codeql #${{ github.run_number }} on ${{ github.ref_name }} (${{ github.event_name }})"

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: codeql / python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
      # Python is read, not built: nothing to compile, so no build step.
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
