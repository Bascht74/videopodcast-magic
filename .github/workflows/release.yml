name: release
run-name: "release #${{ github.run_number }} of ${{ inputs.tag || github.ref_name }} (${{ github.event_name }})"

# What a release has to be, asked of the release itself.
#
# The program keeps itself up to date: it asks github.com for the
# newest release, fetches one file from a tag, and starts again from
# it. Three addresses carry that, and all three are written into the
# program rather than into this file:
#
#   newer_release()   asks RELEASES for the tag of the newest release
#   fetch_new_self()  fetches RAW_FILE % tag, the one file
#   fetch_model()     fetches MODEL_BASE % model_reference(), the model
#
# So this workflow does not restate them. It imports the program at
# that tag and uses its own constants and its own version_key(). What
# it adds is the half no test on a disc can see: whether those
# addresses answer, and whether the release the program asks about
# looks the way the program expects.
#
# tests/text_release_ready_test.py holds the working tree against itself -- one
# version number in the program, the changelog and both READMEs. It
# runs here too, against the files as they are at the tag, and this
# workflow does not check any of it a second time.

on:
  # Only once the release is published. The tag is pushed first and the
  # release made a moment later, so a run on the tag alone asks after
  # something that is not there yet and goes red for it. A check that is
  # red by design is a check nobody reads.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Which tag to hold the release against.'
        required: false
        default: ''

# Runs queue rather than cancel each other: two events belong to one
# release, and the answer of the first is not made pointless by the
# second.
concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name
                     || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  contract:
    name: "Contract: what a release must hold"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.event.release.tag_name
               || github.ref_name }}

    steps:
      - name: "Contract: which release this is about"
        run: |
          echo "event:      $GITHUB_EVENT_NAME"
          echo "repository: $GITHUB_REPOSITORY"
          echo "tag:        $TAG"
          case "$TAG" in
            v*) ;;
            *)  echo "FAIL: '$TAG' is not a tag name. Start this on a"
                echo "      tag, or name one under Run workflow."
                exit 1 ;;
          esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name
                   || github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      # Not read out of the text and not written down here: the program
      # is imported and asked. --version in argv is what tells it that
      # nothing is going to run, so it does not reach for numpy.
      - name: "Contract: the addresses the program itself uses"
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import importlib.util, sys
          sys.argv = ["videopodcast_magic/__init__.py", "--version"]
          spec = importlib.util.spec_from_file_location(
              "vpm", "videopodcast_magic/__init__.py")
          vpm = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(vpm)
          for name in ("VERSION", "RELEASES", "RAW_FILE", "MODEL_BASE",
                       "SPEAKER_MODEL_NAME"):
              print("%s=%s" % (name, getattr(vpm, name)))
          PY
          cat "$GITHUB_ENV"

      - name: "Contract: version, changelog and tag say one number"
        # Every check has its say, even after one before it has
        # gone red: a run that stops at the first is a run that
        # has to be done again to see the rest.
        if: ${{ !cancelled() && env.VERSION != '' }}
        run: |
          fails=0
          check() {
            if [ "$2" = "1" ]; then
              printf '  %-52s ok   %s\n' "$1" "${3:-}"
            else
              printf '  %-52s FAIL %s\n' "$1" "${3:-}"
              fails=$((fails + 1))
            fi
          }

          echo "1. The tag, and what the program calls itself"
          # model_reference() builds the model address out of VERSION as
          # "v" + VERSION. A tag that is named anything else sends a
          # fresh installation to an address that is not there.
          [ "$TAG" = "v$VERSION" ] && ok=1 || ok=0
          check "the tag is v plus the version in the program" "$ok" \
            "tag $TAG, program $VERSION"

          echo
          echo "2. The addresses point at this repository"
          want="https://api.github.com/repos/$GITHUB_REPOSITORY"
          want="$want/releases/latest"
          [ "$RELEASES" = "$want" ] && ok=1 || ok=0
          check "newer_release asks about this repository" "$ok" \
            "$RELEASES"
          # Two names that are nearly the same and are not the same:
          # the repository is videopodcast-magic, the package in it is
          # videopodcast_magic, because only an underscore can be
          # imported. The way in is that package's __init__.py, and it
          # can be called nothing else: only for that name does
          # spec_from_file_location open the folder beside it, so the
          # program can be moved but not renamed. Before 3.0.0 both
          # repository and program were spelled with the hyphen,
          # so an address that built the file name out of the
          # repository name came out right by accident. It no longer
          # does, and this is the check that says so -- an update
          # fetches RAW_FILE and nothing else, so a wrong one here is
          # every installed copy unable to reach the next version.
          want="https://raw.githubusercontent.com/$GITHUB_REPOSITORY"
          want="$want/%s/videopodcast_magic/__init__.py"
          [ "$RAW_FILE" = "$want" ] && ok=1 || ok=0
          check "fetch_new_self fetches from this repository" "$ok" \
            "$RAW_FILE"
          want="https://raw.githubusercontent.com/$GITHUB_REPOSITORY"
          want="$want/%s/videopodcast_magic/models/$SPEAKER_MODEL_NAME/"
          [ "$MODEL_BASE" = "$want" ] && ok=1 || ok=0
          check "fetch_model fetches from this repository" "$ok" \
            "$MODEL_BASE"

          echo
          echo "3. The files at this tag, held against each other"
          # text_release_ready_test.py is the test that does this. It is run, not
          # copied: two lists of the same rule drift apart.
          set +e
          python tests/text_release_ready_test.py
          rc=$?
          set -e
          [ "$rc" = "0" ] && ok=1 || ok=0
          check "tests/text_release_ready_test.py at this tag" "$ok" \
            "returned $rc"

          echo
          [ "$fails" = "0" ] && echo "All good." \
            || { echo "FAIL: $fails of these"; exit 1; }

      - name: "Contract: fetch the program from the address it updates from"
        # Every check has its say, even after one before it has
        # gone red: a run that stops at the first is a run that
        # has to be done again to see the rest.
        if: ${{ !cancelled() && env.VERSION != '' }}
        run: |
          fails=0
          check() {
            if [ "$2" = "1" ]; then
              printf '  %-52s ok   %s\n' "$1" "${3:-}"
            else
              printf '  %-52s FAIL %s\n' "$1" "${3:-}"
              fails=$((fails + 1))
            fi
          }
          # A tag is not on raw.githubusercontent.com the second it is
          # pushed. Five tries over fifty seconds, so a cache that has
          # not caught up is a wait and not a red run.
          fetch() {
            for try in 1 2 3 4 5; do
              curl -fsSL --retry 2 -o "$2" "$1" && return 0
              echo "  ... no answer yet from $1 (try $try of 5)"
              sleep 10
            done
            return 1
          }

          url=$(printf "$RAW_FILE" "$TAG")
          echo "1. $url"
          fetch "$url" /tmp/came-down.py && ok=1 || ok=0
          check "the file the program fetches is there" "$ok" "$url"
          if [ "$ok" = "0" ]; then
            echo "FAIL: nothing came down, so nothing else can be asked"
            exit 1
          fi
          echo "   $(wc -c < /tmp/came-down.py) bytes"

          echo
          echo "2. The three questions self_checked() asks of it"
          set +e
          python - /tmp/came-down.py <<'PY'
          import sys
          raw = open(sys.argv[1], "rb").read()
          bad = 0
          def check(name, ok, extra=""):
              global bad
              print("  %-52s %s %s"
                    % (name, "ok  " if ok else "FAIL", extra))
              bad += 0 if ok else 1
          try:
              text = raw.decode("utf-8")
          except UnicodeDecodeError as e:
              check("it is readable text", False, str(e))
              sys.exit(1)
          check("it is readable text", True, "%d bytes" % len(raw))
          check("it is this program, not an error page",
                "VERSION = " in text and "CATALOGUE" in text)
          try:
              compile(text, "videopodcast_magic/__init__.py", "exec")
              check("it compiles", True)
          except SyntaxError as e:
              check("it compiles", False, "line %s" % e.lineno)
          sys.exit(1 if bad else 0)
          PY
          rc=$?
          set -e
          [ "$rc" = "0" ] && ok=1 || ok=0
          check "what came down passes self_checked()" "$ok"

          echo
          echo "3. It is the file that was tagged"
          cmp -s /tmp/came-down.py videopodcast_magic/__init__.py \
            && ok=1 || ok=0
          a=$(shasum -a 256 /tmp/came-down.py | cut -c1-16)
          b=$(shasum -a 256 videopodcast_magic/__init__.py | cut -c1-16)
          check "byte for byte the file at this tag" "$ok" \
            "$a... came down, $b... was tagged"
          said=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' /tmp/came-down.py \
                 | head -1)
          [ "$said" = "$VERSION" ] && ok=1 || ok=0
          check "it carries the version of this tag" "$ok" \
            "it says $said"

          echo
          [ "$fails" = "0" ] && echo "All good." \
            || { echo "FAIL: $fails of these"; exit 1; }

      - name: "Contract: fetch the model from the address it builds"
        # Every check has its say, even after one before it has
        # gone red: a run that stops at the first is a run that
        # has to be done again to see the rest.
        if: ${{ !cancelled() && env.VERSION != '' }}
        run: |
          fails=0
          check() {
            if [ "$2" = "1" ]; then
              printf '  %-52s ok   %s\n' "$1" "${3:-}"
            else
              printf '  %-52s FAIL %s\n' "$1" "${3:-}"
              fails=$((fails + 1))
            fi
          }
          fetch() {
            for try in 1 2 3 4 5; do
              curl -fsSL --retry 2 -o "$2" "$1" && return 0
              echo "  ... no answer yet from $1 (try $try of 5)"
              sleep 10
            done
            return 1
          }

          # model_reference() says "v" + VERSION, not the tag. Where the
          # two differ the check above has already said so, and this one
          # goes to the address the program really builds.
          base=$(printf "$MODEL_BASE" "v$VERSION")
          echo "1. $base"
          fetch "${base}SHA256SUMS.txt" /tmp/sums.txt && ok=1 || ok=0
          check "the manifest is there" "$ok"
          if [ "$ok" = "0" ]; then
            echo "FAIL: without it fetch_model() falls back to main,"
            echo "      and program and model are then a version apart."
            exit 1
          fi

          # The program's own reading of the file: a line with a
          # 64-character first field, comments skipped.
          awk 'length($1) == 64 && $1 !~ /^#/ {print $1, $NF}' \
            /tmp/sums.txt > /tmp/pairs.txt
          n=$(wc -l < /tmp/pairs.txt | tr -d ' ')
          [ "$n" -gt 0 ] && ok=1 || ok=0
          check "the manifest names files" "$ok" "$n of them"
          [ "$ok" = "0" ] && exit 1

          echo
          echo "2. Every file it names, held against its sum"
          while read -r want name; do
            if ! fetch "$base$name" /tmp/piece; then
              check "$name" 0 "it is not there"
              continue
            fi
            got=$(shasum -a 256 /tmp/piece | awk '{print $1}')
            [ "$got" = "$want" ] && ok=1 || ok=0
            check "$name" "$ok" \
              "$(wc -c < /tmp/piece | tr -d ' ') bytes, ${got:0:16}..."
          done < /tmp/pairs.txt

          echo
          echo "3. What travels with it (fetch_model does not fail on"
          echo "   these, so neither does this)"
          for name in LICENSE-CC-BY-4.0.txt MODEL_CARD.md NOTICE.md; do
            if curl -fsSL -o /dev/null "$base$name"; then
              echo "  $name: there"
            else
              echo "  $name: NOT there"
            fi
          done

          echo
          [ "$fails" = "0" ] && echo "All good." \
            || { echo "FAIL: $fails of these"; exit 1; }

      # Fetched once into two files, and every check below reads those
      # files. That way the answer everybody is judging is the one
      # answer github.com gave, and it can be read afterwards.
      - name: "Contract: what github.com says about this release"
        # Every check has its say, even after one before it has
        # gone red: a run that stops at the first is a run that
        # has to be done again to see the rest.
        if: ${{ !cancelled() && env.VERSION != '' }}
        run: |
          set +e
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            > /tmp/release.json 2> /tmp/release.err
          echo "release/tags/$TAG: $?"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            > /tmp/latest.json 2> /tmp/latest.err
          echo "releases/latest:   $?"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            > /tmp/all.json 2> /tmp/all.err
          echo "releases:          $?"
          set -e
          head -c 400 /tmp/release.err || true
          for f in release latest all; do
            python -c "import json,sys; json.load(open('/tmp/$f.json'))" \
              2>/dev/null || echo "[]" > "/tmp/$f.json"
          done
          python - <<'PY'
          import json
          r = json.load(open("/tmp/release.json"))
          if isinstance(r, dict) and r.get("tag_name"):
              print("  tag        ", r.get("tag_name"))
              print("  name       ", r.get("name"))
              print("  draft      ", r.get("draft"))
              print("  prerelease ", r.get("prerelease"))
              print("  body       ", len(r.get("body") or ""), "characters")
              print("  assets     ", [a["name"] for a in r.get("assets", [])])
          else:
              print("  there is no release for this tag")
          PY

      - name: "Contract: the release as the program expects to find it"
        # Every check has its say, even after one before it has
        # gone red: a run that stops at the first is a run that
        # has to be done again to see the rest.
        if: ${{ !cancelled() && env.VERSION != '' }}
        run: |
          fails=0
          check() {
            if [ "$2" = "1" ]; then
              printf '  %-52s ok   %s\n' "$1" "${3:-}"
            else
              printf '  %-52s FAIL %s\n' "$1" "${3:-}"
              fails=$((fails + 1))
            fi
          }

          there=$(python -c "import json; r = json.load( \
            open('/tmp/release.json')); \
            print(1 if isinstance(r, dict) and r.get('tag_name') else 0)")
          if [ "$there" = "0" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # The documented way round is tag first, release a moment
            # later. Ninety seconds covers that; longer than that is
            # not a broken release, it is one that is not made yet, and
            # the run on release: published asks all of this again.
            for try in 1 2 3 4 5 6; do
              echo "  ... no release for $TAG yet (try $try of 6)"
              sleep 15
              gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
                > /tmp/release.json 2>/dev/null && { there=1; break; }
            done
          fi
          if [ "$there" = "0" ]; then
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "  The tag is there and the release is not. Nothing"
              echo "  here is red for that: this half is asked again"
              echo "  when the release is published."
              exit 0
            fi
            check "there is a release for this tag" 0 "$TAG"
            echo
            echo "FAIL: 1 of these"
            exit 1
          fi
          check "there is a release for this tag" 1 "$TAG"

          python - <<'PY' > /tmp/said.txt
          import json, shlex
          r = json.load(open("/tmp/release.json"))
          latest = json.load(open("/tmp/latest.json"))
          if not isinstance(latest, dict):
              latest = {}
          names = [a["name"] for a in r.get("assets", [])]
          one = [a for a in r.get("assets", [])
                 if a["name"] == "videopodcast_magic.zip"]
          for name, value in (
                  ("draft", 1 if r.get("draft") else 0),
                  ("pre", 1 if r.get("prerelease") else 0),
                  ("body", len(r.get("body") or "")),
                  ("latest", latest.get("tag_name") or ""),
                  ("assets", ",".join(names)),
                  ("archive",
                   one[0]["browser_download_url"] if one else "")):
              print("%s=%s" % (name, shlex.quote(str(value))))
          PY
          . /tmp/said.txt
          cat /tmp/said.txt | sed 's/^/  /'

          echo
          echo "1. It is a release, and it is the newest one"
          # newer_release(): "A pre-release is never the answer: GitHub
          # only calls one release the latest, and it is never one put
          # out for trying." And the owner, 22.8.2026 16:35: the
          # pre-release tick stays off, or the sidebar shows tags
          # instead of versions.
          [ "$draft" = "0" ] && ok=1 || ok=0
          check "it is not a draft" "$ok"
          [ "$pre" = "0" ] && ok=1 || ok=0
          check "it is not a pre-release" "$ok"
          [ "$latest" = "$TAG" ] && ok=1 || ok=0
          check "releases/latest names this tag" "$ok" \
            "it names ${latest:-nothing}"

          # newer_release() offers nothing unless version_key(tag) is
          # greater than the version_key of what is running. A release
          # that sorts older than one already out is one nobody is ever
          # offered. Asked with the program's own version_key.
          set +e
          python - <<'PY'
          import importlib.util, json, sys
          sys.argv = ["videopodcast_magic/__init__.py", "--version"]
          spec = importlib.util.spec_from_file_location(
              "vpm", "videopodcast_magic/__init__.py")
          vpm = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(vpm)
          mine = json.load(open("/tmp/release.json"))["tag_name"]
          out = json.load(open("/tmp/all.json"))
          older = []
          for other in (out if isinstance(out, list) else []):
              tag = other.get("tag_name") or ""
              if tag == mine or other.get("draft"):
                  continue
              if vpm.version_key(tag) >= vpm.version_key(mine):
                  older.append(tag)
          print("  %-52s %s %s"
                % ("nothing already out sorts newer",
                   "ok  " if not older else "FAIL", ",".join(older[:4])))
          sys.exit(1 if older else 0)
          PY
          rc=$?
          set -e
          [ "$rc" = "0" ] || fails=$((fails + 1))

          echo
          echo "2. What somebody is asked to install is said"
          # newer_release() brings the body down with the tag, and
          # update_offer() shows it: "An address alone asks somebody to
          # open a browser to find out what they are about to install,
          # and most will not."
          [ "$body" -gt 0 ] && ok=1 || ok=0
          check "the release says what changed" "$ok" \
            "$body characters"

          # And it is the changelog section itself, not a summary of
          # it: claude_intern.md, the owner's rule of 22.8.2026. The
          # release is made with awk over CHANGELOG.md, and a pattern
          # that misses puts an empty or a wrong section there. Only
          # the count of characters would notice a wrong one.
          # Measured 24.8.2026 against the eight releases that are
          # out: v2.5.0-beta matches its section line for line.
          set +e
          python - "$VERSION" <<'PY'
          import json, re, sys
          want = sys.argv[1]
          body = json.load(open("/tmp/release.json")).get("body") or ""
          text = open("CHANGELOG.md", encoding="utf-8").read()
          head = re.search(r"^## \[%s\][^\n]*\n" % re.escape(want),
                           text, re.M)
          section = ""
          if head:
              rest = text[head.end():]
              stop = re.search(r"^## ", rest, re.M)
              section = rest[:stop.start()] if stop else rest

          def lines(s):
              return [l.rstrip() for l
                      in s.replace("\r\n", "\n").strip().splitlines()]

          same = bool(section) and lines(section) == lines(body)
          print("  %-52s %s %s"
                % ("the release text is the changelog section",
                   "ok  " if same else "FAIL",
                   "%d lines on github.com, %d in the file"
                   % (len(lines(body)), len(lines(section)))))
          sys.exit(0 if same else 1)
          PY
          rc=$?
          set -e
          [ "$rc" = "0" ] || fails=$((fails + 1))

          echo
          echo "3. The whole program hangs on the release"
          # github_moeglichkeiten.md, 24.8.2026: on its own the release
          # page offers Source code (zip) and nothing else -- 63 735 119
          # bytes, because the whole repository is in it. What goes up
          # beside it is the program and nothing else: ten files and
          # 588 141 bytes, measured 4.9.2026.
          #
          # An archive rather than a file since that day: the texts
          # moved into files of their own beside the program, and the
          # program alone dies on import with FileNotFoundError. So
          # either all of it goes up or none of it does.
          case ",$assets," in
            *,videopodcast_magic.zip,*) ok=1 ;;
            *) ok=0 ;;
          esac
          check "videopodcast_magic.zip hangs on the release" "$ok" \
            "it carries: ${assets:-nothing}"
          rm -rf /tmp/asset /tmp/asset.zip
          : > /tmp/found.txt
          if [ "$ok" = "1" ]; then
            mkdir -p /tmp/asset
            curl -fsSL -o /tmp/asset.zip "$archive" || true
            set +e
            python - /tmp/asset.zip /tmp/asset > /tmp/found.txt <<'PY'
          import sys, zipfile
          box = zipfile.ZipFile(sys.argv[1])
          box.extractall(sys.argv[2])
          for name in box.namelist():
              if not name.endswith("/"):
                  print(name)
          PY
            rc=$?
            set -e
            size=$(wc -c < /tmp/asset.zip 2>/dev/null | tr -d ' ')
            [ "$rc" = "0" ] && ok=1 || ok=0
            check "it opens" "$ok" "returned $rc, ${size:-0} bytes"
          else
            check "it opens" 0 "no archive to open"
          fi

          # Both directions at once, so a file left out and a file that
          # does not belong come out as the same line. The listing is
          # taken the way the archive is built -- the package folder,
          # files only -- so a language added tomorrow is asked about
          # without this being touched.
          #
          # Two folders inside it are left out, and the archive leaves
          # out the same two. models/ is 31 MB of speaker model
          # (measured 4.9.2026: the package is 36 MB, of which 31 is
          # the model). The archive is the program, not its data: pip
          # does not ship the model either, the program fetches it when
          # it first needs it, and an attachment that carries it is 31
          # MB somebody downloads to read a state. __pycache__ is not
          # in the repository at all, but the step above imports the
          # program, and importing it writes bytecode into the package.
          # Measured 4.9.2026: eleven files before that import, twenty
          # after -- so without this the listing here holds nine .pyc
          # files the archive cannot have, and a good release goes red.
          #
          # Only this side leaves them out. If the archive carries them
          # anyway that is a fault, and the diff below is what names it.
          #
          # One sorter for both sides, and LC_ALL=C so that it is the
          # order of the bytes. Measured 4.9.2026: a Mac's sort and
          # Python's sorted() disagree about where punctuation goes,
          # because the collation of a locale steps over it -- so two
          # sorters make a difference out of nothing and turn a good
          # release red.
          find videopodcast_magic -type d \
                 \( -name models -o -name __pycache__ \) -prune \
               -o -type f -print 2>/dev/null \
            | LC_ALL=C sort > /tmp/here.txt
          # A pattern that matches nothing returns nothing and says
          # nothing about it -- no shell reports it and no exit code
          # carries it. So the emptiness is asked about rather than
          # walked past: an empty listing here would hold an empty
          # archive to be perfect.
          [ -s /tmp/here.txt ] && ok=1 || ok=0
          check "the tag holds files of the program" "$ok" \
            "$(wc -l < /tmp/here.txt | tr -d ' ') of them"
          LC_ALL=C sort /tmp/found.txt > /tmp/inside.txt
          diff /tmp/here.txt /tmp/inside.txt > /tmp/differ.txt \
            && ok=1 || ok=0
          tagged=$(wc -l < /tmp/here.txt | tr -d ' ')
          inside=$(wc -l < /tmp/inside.txt | tr -d ' ')
          differ=$(tr '\n' ' ' < /tmp/differ.txt)
          check "it holds every file the program is, and no other" "$ok" \
            "$tagged at this tag, $inside in it; $differ"

          # Byte for byte, every one of them. The checkout is the tag,
          # so this is the whole question of whether what somebody
          # downloads is the state that was tested.
          bad=""
          while read -r name; do
            [ -n "$name" ] || continue
            cmp -s "/tmp/asset/$name" "$name" || bad="$bad $name"
          done < /tmp/inside.txt
          [ -s /tmp/inside.txt ] && [ -z "$bad" ] && ok=1 || ok=0
          check "and every file in it is the file at this tag" "$ok" \
            "${bad:-$inside of them}"

          echo
          echo "4. And a sum somebody who is not us can check it by"
          # The checks above are our answer to ourselves: they hold what
          # came down against the files in this checkout. Whoever
          # downloads has neither, so a manifest goes up beside the
          # archive -- the same name and the same shape the model
          # already carries, so one reader serves both.
          #
          # Over the archive, not over the files inside it. An archive
          # cannot be built twice into the same bytes -- it carries the
          # times and the order the files went in -- so a sum over the
          # files would be one nobody could repeat against what is in
          # their hand, while the archive's own sum is exactly that.
          # Whether the files inside are the tagged ones is the check
          # above, and it needs no sum to say so.
          case ",$assets," in
            *,SHA256SUMS.txt,*) ok=1 ;;
            *) ok=0 ;;
          esac
          check "SHA256SUMS.txt hangs on the release" "$ok" \
            "it carries: ${assets:-nothing}"
          if [ "$ok" = "1" ]; then
            sums=$(python -c "import json; print([a['browser_download_url'] \
              for a in json.load(open('/tmp/release.json'))['assets'] \
              if a['name'] == 'SHA256SUMS.txt'][0])")
            curl -fsSL -o /tmp/sums-release.txt "$sums"
            want=$(awk 'length($1) == 64 && $NF == "videopodcast_magic.zip" \
                        {print $1}' /tmp/sums-release.txt | head -1)
            # What it does name, not how many lines long it is: whoever
            # reads this on a red run has the manifest nowhere else,
            # and a manifest still naming the one file the program used
            # to be is the way this goes wrong.
            held=$(awk 'length($1) == 64 {print $NF}' \
                   /tmp/sums-release.txt | tr '\n' ' ')
            [ -n "$want" ] && ok=1 || ok=0
            check "it names videopodcast_magic.zip" "$ok" \
              "it names: ${held:-nothing}"
            got=""
            [ -f /tmp/asset.zip ] \
              && got=$(shasum -a 256 /tmp/asset.zip | awk '{print $1}')
            [ -n "$want" ] && [ "$want" = "$got" ] && ok=1 || ok=0
            check "and the sum is the sum of the archive on the release" \
              "$ok" \
              "${want:0:16}... says the manifest, ${got:0:16}... is it"
          else
            check "it names videopodcast_magic.zip" 0 "no manifest"
            check "and the sum is the sum of the archive on the release" 0 \
              "no manifest"
          fi

          echo
          [ "$fails" = "0" ] && echo "All good." \
            || { echo "FAIL: $fails of these"; exit 1; }

      - name: "Contract: it installs as a package and answers"
        # That it installs and answers, not which files are in it.
        # Which files are in it is asked on the disc, in the freigabe
        # skill, before the push: setuptools builds a package out of
        # the working folder and uses the `build/` beside it again
        # instead of building afresh, so a `build/` from an older shape
        # of the program walks into the new package while git stays
        # clean -- measured 4.9.2026, 21 files instead of 11. Here that
        # cannot happen and so cannot be seen: the checkout is fresh
        # and pip installs from a git URL, so the check would be green
        # for ever on a machine where the fault does not exist. Whoever
        # builds one here anyway builds a second answer to a question
        # that is already answered earlier and in the right place.
        #
        # Every check has its say, even after one before it has
        # gone red: a run that stops at the first is a run that
        # has to be done again to see the rest.
        if: ${{ !cancelled() && env.VERSION != '' }}
        run: |
          fails=0
          check() {
            if [ "$2" = "1" ]; then
              printf '  %-52s ok   %s\n' "$1" "${3:-}"
            else
              printf '  %-52s FAIL %s\n' "$1" "${3:-}"
              fails=$((fails + 1))
            fi
          }

          echo "1. What pyproject.toml says before anything is built"
          # The version now stands in a second file, and that is a new
          # way to get a release wrong: pip would hand somebody a
          # package calling itself one thing and a program calling
          # itself another, and nothing on the release page would look
          # amiss. Held letter for letter, because pyproject.toml
          # settles it that way itself: one spelling, the one pip
          # writes down, here and in the program and on the tag.
          set +e
          python - <<'PY' > /tmp/said-project.txt
          import re, tomllib
          with open("pyproject.toml", "rb") as f:
              project = tomllib.load(f)["project"]
          print("version=%s" % project["version"])
          for needs in project.get("dependencies", []):
              # "PySide6", "numpy>=2" and "numpy [extra]" all come down
              # to the name pip knows the package by.
              print("needs=%s"
                    % re.split(r"[^A-Za-z0-9._-]", needs, maxsplit=1)[0])
          PY
          rc=$?
          set -e
          [ "$rc" = "0" ] && ok=1 || ok=0
          check "pyproject.toml reads, and names a version" "$ok" \
            "returned $rc"
          said=$(sed -n 's/^version=//p' /tmp/said-project.txt | head -1)
          [ -n "$said" ] && [ "$said" = "$VERSION" ] && ok=1 || ok=0
          check "and it is the version in the program" "$ok" \
            "pyproject ${said:-nothing}, program $VERSION"
          sed -n 's/^needs=/  it asks pip for /p' /tmp/said-project.txt

          echo
          echo "2. pip builds a package out of it and installs it"
          # The line a reader is given, aimed at this tag. pip clones
          # the repository and builds from pyproject.toml, so nothing
          # of this checkout is used: a module renamed on a disc but
          # not committed under the new name comes out red here rather
          # than green. Into an environment of its own, so that what
          # the runner already had cannot stand in for what the
          # package brings.
          python -m venv /tmp/package && ok=1 || ok=0
          check "an environment of its own to install into" "$ok" \
            "/tmp/package"
          if [ "$ok" = "0" ]; then
            echo
            echo "FAIL: $fails of these"
            exit 1
          fi

          url="git+https://github.com/$GITHUB_REPOSITORY@$TAG"
          echo "   pip install $url"
          # The dependencies are fetched with it and not skipped. They
          # are the slow half -- PySide6 and numpy are a few hundred
          # megabytes -- but a name in that list is spelled nowhere
          # else and tried nowhere else, so skipping them would leave
          # the one thing about them that can break unasked.
          #
          # The three tries are not a cache catching up: git hands out
          # a tag the moment it is pushed. They are for pypi.org, a
          # second machine that can have a bad minute.
          ok=0
          for try in 1 2 3; do
            /tmp/package/bin/pip install --disable-pip-version-check \
              "$url" && { ok=1; break; }
            echo "  ... it did not install (try $try of 3)"
            sleep 10
          done
          check "pip installs it from this tag" "$ok" "$url"
          if [ "$ok" = "0" ]; then
            echo
            echo "FAIL: $fails of these"
            exit 1
          fi

          # pyproject.toml: "the way pip spells it". If it is spelled
          # any other way pip writes down its own -- 3.0.0-beta becomes
          # 3.0.0b0 -- and the release page and pip then name the same
          # version differently.
          pipsaid=$(/tmp/package/bin/pip show videopodcast-magic \
                    | sed -n 's/^Version: //p')
          [ -n "$pipsaid" ] && [ "$pipsaid" = "$said" ] && ok=1 || ok=0
          check "pip writes the version down unchanged" "$ok" \
            "pyproject ${said:-nothing}, pip ${pipsaid:-nothing}"

          # Every package pyproject names, asked of the environment
          # afterwards. Read out of the file rather than written here,
          # so a package added there is asked about without this being
          # touched.
          sed -n 's/^needs=//p' /tmp/said-project.txt > /tmp/needs.txt
          while read -r needs; do
            [ -n "$needs" ] || continue
            /tmp/package/bin/pip show "$needs" > /dev/null 2>&1 \
              && ok=1 || ok=0
            check "pip brought $needs along" "$ok"
          done < /tmp/needs.txt

          echo
          echo "3. The command it puts there answers"
          [ -x /tmp/package/bin/videopodcast-magic ] && ok=1 || ok=0
          check "there is a videopodcast-magic command" "$ok" \
            "the package left: $(ls /tmp/package/bin | tr '\n' ' ')"
          set +e
          said=$(/tmp/package/bin/videopodcast-magic --version 2>&1)
          rc=$?
          set -e
          [ "$rc" = "0" ] && ok=1 || ok=0
          check "--version answers" "$ok" "returned $rc: $said"
          case "$said" in
            *"$VERSION"*) ok=1 ;;
            *) ok=0 ;;
          esac
          check "--version names $VERSION" "$ok" "${said:-nothing}"

          echo
          [ "$fails" = "0" ] && echo "All good." \
            || { echo "FAIL: $fails of these"; exit 1; }

      - name: "Contract: what this run found"
        if: always()
        run: |
          {
            echo "## $TAG"
            echo
            echo "Asked of ${GITHUB_REPOSITORY} on"\
                 "\`$GITHUB_EVENT_NAME\`."
            echo
            echo "* the file: \`$(printf "$RAW_FILE" "$TAG")\`"
            echo "* the model: \`$(printf "$MODEL_BASE" "v$VERSION")\`"
            echo "* the release: \`$RELEASES\`"
          } >> "$GITHUB_STEP_SUMMARY"

  starts:
    name: it starts (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
          # The floor the program names for itself: NEEDS_PYTHON is
          # (3, 10), and it says so in a line it prints before
          # anything else. Somebody who has a Python at all mostly
          # has the one that came with the machine -- and that machine
          # is as often a Windows or a Mac as it is a Linux, so the
          # floor is walked on all three. This job fetches one file and
          # installs nothing, so the two extra runs cost about a minute
          # each. On Windows and macOS '3.10' comes out as 3.10.11, the
          # last one CPython released as a binary.
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.10'
          - os: macos-latest
            python: '3.10'
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name
               || github.ref_name }}
      VPM_NO_UPDATE_CHECK: '1'
      # Windows hands Python a cp1252 stdout, and the switch list has
      # characters in it that cp1252 has no room for.
      PYTHONUTF8: '1'

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # No checkout and no packages: what is asked here is that the
      # files standing at the tag start when they stand beside each
      # other, which is what pip hands somebody. It used to fetch one
      # file, because the program was one; since 4.9.2026 the program is
      # a package folder and a piece of it on its own dies on import, so
      # the whole folder is fetched and what is in it is counted rather
      # than written down -- a language added tomorrow travels by
      # itself. --version and --help are the two ways in that the
      # program promises to answer without numpy.
      - name: "Start: fetch what stands at the tag, then run it"
        shell: bash
        run: |
          fails=0
          check() {
            if [ "$2" = "1" ]; then
              printf '  %-52s ok   %s\n' "$1" "${3:-}"
            else
              printf '  %-52s FAIL %s\n' "$1" "${3:-}"
              fails=$((fails + 1))
            fi
          }

          # The archive is the list -- no API call, so no rate limit and
          # no jq. Its address is fixed once the tag exists, and Python
          # opens it, which is the one tool certain to be here.
          raw="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          echo "$raw/videopodcast_magic.zip"
          ok=0
          for try in 1 2 3 4 5; do
            curl -fsSL --retry 2 -o vpm.zip "$raw/videopodcast_magic.zip" \
              && { ok=1; break; }
            echo "  ... no answer yet (try $try of 5)"
            sleep 10
          done
          check "the archive came down" "$ok" "$(wc -c < vpm.zip 2>/dev/null) bytes"
          [ "$ok" = "1" ] || { echo "FAIL: 1 of these"; exit 1; }

          python -c "import zipfile; zipfile.ZipFile('vpm.zip').extractall('.')"
          # Counted inside the folder, not by a name pattern beside it.
          # Until 4.9.2026 this was "ls videopodcast_magic*.py", and the
          # day the program became a folder that pattern matched
          # nothing -- which nothing reports: a glob that hits nothing
          # is handed on unchanged, ls says its own thing about it, and
          # the count that comes out is 0 either way. The "|| n=0" is
          # there so the counting itself cannot end the step before the
          # line below has said what was found.
          n=$(find videopodcast_magic -type f -name '*.py' 2>/dev/null \
              | wc -l | tr -d ' ') || n=0
          [ "$n" -ge 2 ] && ok=1 || ok=0
          check "it holds the program and its texts" "$ok" "$n files"
          [ -f videopodcast_magic/__init__.py ] && ok=1 || ok=0
          check "and the way in is where it has to be" "$ok" \
            "videopodcast_magic/__init__.py"
          [ "$ok" = "1" ] || { echo "FAIL: 1 of these"; exit 1; }
          # Renamed on purpose, one level up from where it used to be:
          # the program finds its texts beside itself, whatever the
          # folder is called, so this proves the neighbours carry it and
          # not the name. The folder can be called anything; the file
          # inside it cannot be called anything but __init__.py, which
          # is why the rename moved up here.
          mv videopodcast_magic vpm

          echo
          set +e
          said=$(python vpm/__init__.py --version 2>&1)
          rc=$?
          set -e
          [ "$rc" = "0" ] && ok=1 || ok=0
          check "--version answers" "$ok" "returned $rc: $said"
          case "$said" in
            *"${TAG#v}"*) ok=1 ;;
            *) ok=0 ;;
          esac
          check "--version names ${TAG#v}" "$ok" "$said"

          set +e
          python vpm/__init__.py --help > /tmp/help.txt 2>&1
          rc=$?
          set -e
          [ "$rc" = "0" ] && ok=1 || ok=0
          check "--help answers" "$ok" "returned $rc"
          head -1 /tmp/help.txt | grep -q '^usage:' && ok=1 || ok=0
          check "--help begins with a usage line" "$ok" \
            "$(head -1 /tmp/help.txt)"
          echo "  $(wc -l < /tmp/help.txt | tr -d ' ') lines of switches"

          echo
          [ "$fails" = "0" ] && echo "All good." \
            || { echo "FAIL: $fails of these"; exit 1; }
