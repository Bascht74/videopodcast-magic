name: tests

# The commit subject is what GitHub calls a run by default, so the list
# of runs reads as a heap of unrelated sentences. A run is one thing --
# the suite, on a commit -- and it says so, in the same shape every
# time, with the number the list is ordered by.
#
# And since 4.9.2026 two suites go under this name: one with the speaker
# separation in it and one without. A green run whose line does not say
# which of the two it was is worth half a run, so the line says it, in
# both directions -- "off" is written out rather than left to be
# inferred from a missing word, because a reader who does not know the
# default cannot read a silence.
run-name: "suite #${{ github.run_number }} on ${{ github.ref_name }} -- separation ${{ (inputs.speaker_split == true || inputs.speaker_split == 'true') && 'on' || 'off' }}"

on:
  # Branches only. A tag points at a commit the suite has already
  # answered for, and a second run of it says nothing new.
  push:
    branches:
      - '**'
  pull_request:
  # Nothing here is pinned: requirements.txt names numpy and PySide6
  # without a version, ffmpeg is whatever the package service has that
  # day, and the Python patch levels move under setup-python. So a green
  # main can go bad without anybody pushing anything. Once a week it is
  # asked again. Monday morning, and not on the hour: that is when the
  # whole world's cron jobs start at once and the runners queue.
  schedule:
    - cron: '17 5 * * 1'
  # The switch is written out twice below, once here and once under
  # workflow_call, and the duplication is not an oversight. The two
  # blocks are separate and inherit nothing from one another: declared
  # under only one of them, the other way in has no such input at all,
  # falls to the empty string, and comes out "off" -- green, and with
  # nobody the wiser. So both carry it, with the same name, the same
  # type and the same default, and publish.yml overrides the default
  # rather than relying on it.
  workflow_dispatch:
    inputs:
      speaker_split:
        description: >
          Run the speaker separation as well. Off by default: pyannote
          and torch are 828 MB and about two minutes of installing on
          every one of the six jobs, and exactly one test uses them.
          Every release turns it on.
        type: boolean
        default: false
  # Called by publish.yml, so that a release runs the suite itself
  # rather than asking whether somebody ran it earlier. The called
  # workflow runs on the caller's commit, which is the whole point:
  # what is tagged is what was tested, and nothing has to be held
  # against anything afterwards.
  workflow_call:
    inputs:
      speaker_split:
        description: >
          Run the speaker separation as well. publish.yml passes true,
          because a release answers for the whole program. The default
          is false so that this workflow behaves the same way whoever
          calls it and however it is started.
        type: boolean
        required: false
        default: false

# A second push to the same branch makes the first run pointless.
# The event is part of the group, or the weekly run would be cancelled
# by the first push of the week -- which is the one week it is there for.
#
# On main it is never pointless. A tag can hang on any commit there, and
# a tag whose attachment nothing answered for is worse than no tag.
# Measured 5.9.2026: ba63d8e on main was cancelled by the push after it
# and stands to this day with no answer of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  suite:
    # No slash in it, and that is the whole point. GitHub's list of
    # jobs shows only the last piece after a slash, so six jobs called
    # "<system> / py<version>" came out as py3.14 and py3.10 six times
    # over -- and which system is which was nowhere. Read off a picture
    # of the first release run, not measured; the next run says whether
    # it holds. The short name is the reader's word for the machine, not
    # the runner image's.
    name: ${{ matrix.label }} py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two versions on all three systems. 3.14 is the one the suite
        # runs on at home; 3.10 is the floor the program names for
        # itself in NEEDS_PYTHON, and a floor that is only ever walked
        # on Linux is not a floor. What breaks between 3.10 and 3.14
        # -- a path, an encoding, a Qt plugin -- breaks on Windows and
        # macOS, so that is where it has to be walked.
        #
        # On Windows and macOS '3.10' comes out as 3.10.11: that is the
        # last 3.10 CPython released as a binary, and setup-python
        # builds newer ones from source for Linux only. Linux therefore
        # runs a later 3.10 than the other two. That is the truth of the
        # matter for anyone out there on 3.10 as well.
        include:
          - os: ubuntu-latest
            label: Linux
            python: '3.14'
          - os: ubuntu-latest
            label: Linux
            python: '3.10'
          - os: windows-latest
            label: Windows
            python: '3.14'
          - os: windows-latest
            label: Windows
            python: '3.10'
          - os: macos-latest
            label: macOS
            python: '3.14'
          - os: macos-latest
            label: macOS
            python: '3.10'

    env:
      VPM_PYTHON: python
      QT_QPA_PLATFORM: offscreen
      VPM_FIXTURES: /tmp/vpm-fixtures-ci
      # The same folder again, and it has to stay the same: run.sh would
      # work this out for itself, but saying it here means the suite and
      # the step that repeats a red test read it from one place.
      VPM_MEDIA: /tmp/vpm-fixtures-ci/interview
      # Windows hands Python a cp1252 stdout, and a caption with a box
      # or a tick in it then stops the test that prints it.
      PYTHONUTF8: '1'

      # The conditions the suite runs under, in one place. run.sh exports
      # the same six itself, with the same values, so the suite is
      # unchanged by their standing here -- but now every other step in
      # the job inherits them too, and "the red ones, in full" no longer
      # keeps a second list of its own that can fall behind. English is
      # the source language of the program and LANGUAGE is the first name
      # it looks at; the rest keep the suite from making noise, fetching
      # a 218 MB model, or asking github.com about updates.
      LANG: C
      LC_ALL: C
      LANGUAGE: en
      VPM_SILENT: '1'
      VPM_NO_SPEAKER_SPLIT: '1'
      VPM_NO_UPDATE_CHECK: '1'

      # The switch, worked out once and read by every step below it.
      #
      # It is not VPM_NO_SPEAKER_SPLIT and must not be confused with it.
      # That one is the program's own, it is set to 1 here and in
      # run.sh whatever this run does, and it only keeps the program
      # from starting the separation of its own accord. This one decides
      # something else entirely: whether pyannote and torch are
      # installed at all, and whether the one test that really runs the
      # separation is in the folder.
      #
      # Three ways in and one expression for all three. Under
      # workflow_dispatch and workflow_call the input is a real boolean,
      # so the first half answers; started through the API or gh, the
      # same input arrives as the string "true", which is why the second
      # half is there -- GitHub casts across types by turning both sides
      # into numbers, and 'true' is not a number, so 'true' == true is
      # false. Under push, pull_request and schedule there is no input
      # at all: the empty string, which is neither, and the run comes
      # out off. Off is what a push should be, so the one case that
      # cannot be measured from here is also the one where every reading
      # gives the same answer.
      SPEAKER_SPLIT: ${{ inputs.speaker_split == true || inputs.speaker_split == 'true' }}

    steps:
      - uses: actions/checkout@v5

      # Before setup-python, because this file is one of the three the
      # pip cache's key is hashed over, and it is the only one of them
      # that says which of the two installations this run makes.
      #
      # Without it the key is the same for both, and the shape of what
      # follows is one this house has already paid for once: the key
      # used to hang on requirements-dev.txt alone, which had not
      # changed since 22.8.2026, so every run hit the primary key and a
      # hit is exactly the case in which nothing is written back. Here
      # it would be a run with the separation getting the cache of a run
      # without it -- no torch wheels in it, 828 MB fetched again,
      # primary key hit, nothing saved, for ever. Both runs stay green
      # throughout, which is why it has to be settled here rather than
      # noticed later.
      #
      # Computed on this machine 4.9.2026 with @actions/glob's own
      # hashFiles -- sha256 over the concatenated per-file sha256
      # digests, in the order the paths are named:
      #   speaker_split false   f4da26726aa831bb...
      #   speaker_split true    8aa0145cb2efb3f1...
      #
      # In the workspace, and that is not a matter of taste. hashFiles
      # walks past every file whose path does not begin with
      # GITHUB_WORKSPACE and says so only in its own debug log -- so a
      # marker under RUNNER_TEMP would be ignored, the other two files
      # would still hash, the key would come out identical for both
      # runs, and nothing anywhere would go red.
      - name: "Record: whether this run installs the separation"
        shell: bash
        run: |
          printf '%s\n' "$SPEAKER_SPLIT" > ci-speaker-split.txt
          echo "speaker_split: $SPEAKER_SPLIT"

      # Both lists, and that is the whole point. The key of the pip cache
      # is a hash over the files named here, and requirements-dev.txt is
      # two lines: "-r requirements.txt" and pyspellchecker. Every package
      # the program really needs stands in the other file, which the key
      # never looked at -- so a package added over there left the key
      # unchanged, the primary key hit, and a hit is exactly the case in
      # which nothing is written back. The wheels were fetched again on
      # every run, for ever, and the cache stayed at the state of
      # 22.8.2026, the last day requirements-dev.txt itself changed.
      #
      # Measured 4.9.2026 on run 33890253599: "Cache hit occurred on the
      # primary key ..., not saving cache" in all six jobs, seven wheels
      # re-fetched on Linux and six on Windows -- the ones faster-whisper
      # brought in that morning. The key in that log is
      # 4f0debf968642fc2..., and hashing requirements-dev.txt alone here
      # gives the same digits, which is how the cause was pinned down
      # rather than guessed.
      #
      # And the third path is the switch, written down by the step
      # above. Two installations under one key is the same defect in a
      # new coat, and it is argued out where that file is written.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            ci-speaker-split.txt

      # Git for Windows rewrites text files to CRLF on checkout. The model
      # beside the program carries a manifest of SHA-256 sums, and one of
      # the five files it names is text.
      - name: "Check out: verify the speaker model survived it"
        shell: bash
        run: |
          M=videopodcast_magic/models/speaker-diarization-community-1
          echo "core.autocrlf: $(git config --get core.autocrlf || echo '(unset)')"
          python -c "import hashlib,sys; \
            print('config.yaml as it lies here:', \
              hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" \
            "$M/config.yaml"
          echo -n "the manifest says:                    "
          grep -E "^[0-9a-f]{64}  config\.yaml" "$M/SHA256SUMS.txt" \
            | awk '{print $1}'

      - name: "Check out: restore the model files byte for byte"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git rm --cached -r -q .
          git reset --hard -q
          M=videopodcast_magic/models/speaker-diarization-community-1
          python -c "import hashlib,sys; \
            print('config.yaml now:', \
              hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" \
            "$M/config.yaml"

      # The two steps above print a hash and throw it away. Here the
      # manifest is actually held against the files -- all five it names,
      # not only the one that is text -- and a difference stops the job.
      # After the Windows repair, so what is judged is what the suite
      # will read.
      - name: "Check out: hold the model against its manifest"
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, re, sys
          M = "videopodcast_magic/models/speaker-diarization-community-1"
          manifest = os.path.join(M, "SHA256SUMS.txt")
          # Text mode, so a CRLF the checkout may have left behind does
          # not end up inside the file name.
          with open(manifest, encoding="utf-8") as f:
              want = re.findall(r"(?m)^([0-9a-f]{64})  (\S.*)$", f.read())
          if not want:
              sys.exit("FAIL: %s names no file at all" % manifest)
          bad = 0
          for digest, name in want:
              path = os.path.join(M, name)
              if not os.path.exists(path):
                  print("  %-30s FAIL not there" % name)
                  bad += 1
                  continue
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              if h.hexdigest() == digest:
                  print("  %-30s ok   %d bytes" % (name, os.path.getsize(path)))
              else:
                  print("  %-30s FAIL %s" % (name, h.hexdigest()))
                  bad += 1
          print("%d files named, %d wrong" % (len(want), bad))
          sys.exit(1 if bad else 0)
          PY

      # apt is the bottleneck here, not the platform: Ubuntu 24.04
      # carries ffmpeg 6.1.1, under the floor this program names, and
      # nothing newer is in its archive. A static build settles it in
      # half a minute -- and it is the one of the three runners that
      # carries soxr, so the fine clock correction is exercised
      # somewhere. macOS takes what brew gives once its own formula
      # index has been refreshed (9.0.1, no soxr) and Windows what choco
      # gives (9.0.1): three runners, and both paths through the drift
      # correction.
      - name: "Install: ffmpeg (Linux)"
        if: runner.os == 'Linux'
        run: |
          set -e
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          name=ffmpeg-n9.0-latest-linux64-gpl-9.0
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz "$base/$name.tar.xz"
          tar -xJf /tmp/ff.tar.xz -C /tmp
          sudo install -m755 "/tmp/$name/bin/ffmpeg" "/tmp/$name/bin/ffprobe" \
                             /usr/local/bin/
          ffmpeg -version | head -1
          # Said, not demanded. soxr decides how finely the clock drift
          # between cameras comes out -- 0.21 ppm against 21 -- and
          # coarser is not broken, so a build without it must not fail a
          # job. It is printed because a run that behaves oddly in the
          # drift correction is read back from here.
          ffmpeg -version | tr ' ' '\n' | grep -q enable-libsoxr \
            && echo "soxr:   yes" || echo "soxr:   no"

      - name: "Install: ffmpeg and a time limit (macOS)"
        if: runner.os == 'macOS'
        run: |
          set -e
          # Not "only if none is there": what counts is the version and
          # not the presence. The bottle is poured in seconds; no build.
          #
          # brew update first, and that is the whole of the difference.
          # The runner image carries a Homebrew whose formula index is
          # frozen at the day the image was built, and nothing refreshes
          # it by itself. Measured 4.9.2026 out of the last green run:
          # brew fetched the manifest for 8.1.2_1, printed no
          # "Auto-updating" line anywhere in the run, and homebrew/core
          # had 9.0.1 that same hour.
          #
          # Nothing on these three lines decides anything, and that is
          # on purpose: a bad minute at github.com must not be a red
          # suite. They are said and walked past, and what judges is the
          # version at the foot of this step -- which is a better line
          # to read than a brew error, because it names what was wanted
          # and what is there.
          brew update || brew update \
            || echo "brew update did not run -- the check below decides"
          brew install ffmpeg || brew upgrade ffmpeg \
            || echo "brew could not put ffmpeg down -- likewise"
          ffmpeg -version | sed -n 1p
          # Said, not demanded, the way the Linux step says it. soxr
          # decides how finely the clock drift between cameras comes
          # out and coarser is not broken; homebrew/core builds without
          # it in every version. The owner, 4.9.2026: on the build
          # machines a version without soxr is taken even in case of
          # doubt -- for the tests that is fine. A hard soxr check here
          # would be a mine: Linux goes red the day BtbN changes its
          # build.
          ffmpeg -version | tr ' ' '\n' | grep -q enable-libsoxr \
            && echo "soxr:   yes" || echo "soxr:   no"

          # And now the step is held to what it just claimed to do.
          # It used to end in "|| true", which swallowed every failure:
          # the whole line could fail and the job walked on green. That
          # is why this Mac sat on 8.1.2 for weeks while the other two
          # runners were on 9.0.1 and nobody saw it -- a version was
          # printed, and a printed version is read by nobody.
          #
          # No version number is written here. brew is asked what its
          # formula names and what it actually put down, so the day the
          # formula moves this rises by itself and no second place has
          # to be remembered. Two questions, and they fail differently:
          # a stale index leaves formula and keg apart, something
          # earlier on PATH leaves keg and the answering binary apart.
          formula=$(brew info --json=v2 --formula ffmpeg \
            | python -c "import json, sys; print(json.load(sys.stdin) \
                ['formulae'][0]['versions']['stable'])") || formula=""
          keg=$(brew list --versions ffmpeg | awk '{print $2}') || keg=""
          said=$(ffmpeg -version | sed -n 1p \
                 | sed -n 's/^ffmpeg version n\{0,1\}\([0-9][0-9.]*\).*/\1/p')
          echo "formula: ${formula:-?}  installed: ${keg:-?}  answering: ${said:-?}"
          bad=0
          if [ -z "$formula" ] || [ "${keg%%_*}" != "$formula" ]; then
            bad=1
            echo "FAIL: homebrew/core names ffmpeg ${formula:-nothing} and"
            echo "      brew put down ${keg:-nothing}. Either the formula"
            echo "      index is still stale after brew update, or the"
            echo "      install did not take. Nothing below this line has"
            echo "      been run against the ffmpeg this suite needs."
          fi
          if [ -z "$said" ] || [ "$said" != "${keg%%_*}" ]; then
            bad=1
            echo "FAIL: brew put down ${keg:-nothing} and the ffmpeg that"
            echo "      answers says ${said:-nothing}. The one that"
            echo "      answers is $(command -v ffmpeg || echo 'nowhere on PATH')."
            echo "      Either nothing was installed at all, or"
            echo "      something ahead of /opt/homebrew/bin on PATH is"
            echo "      being asked instead of what was installed."
          fi
          [ "$bad" = "0" ] || exit 1
          # macOS brings no timeout(1), and run.sh says so and then runs
          # the tests unguarded. One test that hangs there sits until the
          # job's thirty minutes are up and leaves nothing behind. GNU
          # coreutils installs the same program under the name gtimeout,
          # which is the second name run.sh looks for.
          command -v gtimeout > /dev/null 2>&1 || brew install coreutils
          if ! command -v gtimeout > /dev/null 2>&1; then
            echo "coreutils is installed but gtimeout is not on PATH --"
            echo "without it the suite runs here with no time limit, so"
            echo "this stops now rather than later. brew link coreutils."
            exit 1
          fi

      - name: "Install: ffmpeg (Windows)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if command -v ffmpeg > /dev/null 2>&1; then
            exit 0
          fi
          choco install ffmpeg -y --no-progress || true
          # Asked of the machine, not of choco's return code. Measured
          # 5.9.2026: community.chocolatey.org answered 504, choco said
          # "Unable to find package 'ffmpeg'" and "installed 0/0
          # packages" -- and returned 0. The step went green, and the
          # run fell two steps later with a bare exit 127 that named
          # nothing. Once in fifteen runs, both Windows jobs at once,
          # which is what an outage somewhere else looks like.
          if ! command -v ffmpeg > /dev/null 2>&1; then
            echo "FAIL: no ffmpeg after choco install, and choco"
            echo "      reported success. What the package server"
            echo "      answered stands above this line."
            exit 1
          fi

      - name: "Install: what Qt needs without a screen (Linux)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxcb-xinerama0 \
            libfontconfig1 libfreetype6 libpulse0
          # libpulse0 is named here because QtMultimedia loads it and
          # dies without it. It used to arrive as a by-catch of
          # apt-get install ffmpeg; the static build brought that to
          # light by not dragging it along. A dependency nobody names
          # is one nobody can miss until it is gone.

      # Here, and not before the installations. Asked before them, this
      # step answered "ffmpeg: NOT THERE" in every job that has ever run
      # here -- true, and of no use to anybody. What is wanted is the
      # ffmpeg the suite is about to run against. A defect that hangs on
      # an ffmpeg version leaves no trace otherwise, and this house has
      # had one: the colour tags in ffmpeg 9.
      - name: "Record: the versions this run used"
        shell: bash
        run: |
          echo "runner:  $RUNNER_OS $RUNNER_ARCH"
          echo "python:  $(python -VV)"
          echo "cores:   $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo '?')"
          echo "bash:    $BASH_VERSION"
          echo "id -u:   $(id -u 2>&1 || echo '?')"
          for t in ffmpeg ffprobe timeout gtimeout; do
            if command -v "$t" > /dev/null 2>&1; then
              echo "$t: $(command -v $t)"
            else
              echo "$t: NOT THERE"
            fi
          done
          # sed rather than head: head closes the pipe early, and under
          # pipefail that turns a good ffmpeg into a failed step.
          ffmpeg -version 2>&1 | sed -n 1p > "$RUNNER_TEMP/ffmpeg.txt"
          cat "$RUNNER_TEMP/ffmpeg.txt"
          ffprobe -version 2>&1 | sed -n 1p

      - name: "Install: the Python packages"
        shell: bash
        run: |
          python -m pip install --upgrade pip

          # With the separation on, the list is installed exactly as it
          # is written and as it has always been. That path is not
          # touched, so every measurement made against it still holds.
          #
          # With it off, the list is still the one list. It is not
          # copied and there is no second file to keep in step -- a
          # second file is a second truth, and it goes stale the first
          # time somebody adds a package over there. requirements-dev.txt
          # is flattened here, its "-r" lines pulled in where they stand,
          # and the two packages that only the separation needs are
          # struck out of the result. Add a package to either list and it
          # arrives in both runs; the only thing named here is what is
          # left out.
          #
          # And what is named here is held to being real. A filter that
          # matches nothing removes nothing and says nothing about it --
          # which is how a run would go on fetching 828 MB while its own
          # line claimed the separation was off. So each name has to be
          # struck for the step to go on, and the day requirements.txt
          # spells one of them differently this stops rather than
          # quietly installing everything.
          if [ "$SPEAKER_SPLIT" = "true" ]; then
            # On Linux pip's default answer for torch is the CUDA build.
            # Measured 5.9.2026 on run 33955547419: this step fetches
            # 3504 MB there, and 2188 MB of that is fourteen nvidia_*
            # packages -- 62 %, and not one byte of it is reachable on a
            # builder with no graphics card. It is also what fills the
            # cache: 12.6 GB against a limit of 10.
            #
            # The CPU build carries the same version numbers, checked in
            # the index before this was written rather than assumed:
            # torch 2.14.0+cpu and torchvision 0.29.0+cpu exist for
            # cp310 and cp314 on manylinux_2_28_x86_64, and those are
            # the two the jobs run. So what is tested is the same
            # program, without the part of it that cannot be used here.
            #
            # Linux only: macOS and Windows have no CUDA build to fall
            # into, and pip already fetches the plain wheel there. And
            # ahead of the list, so pyannote finds torch already in
            # place and does not pull the other one in behind it.
            if [ "$RUNNER_OS" = "Linux" ]; then
              python -m pip install \
                --index-url https://download.pytorch.org/whl/cpu \
                torch torchvision
            fi
            python -m pip install -r requirements-dev.txt
          else
            flat="$RUNNER_TEMP/requirements-flat.txt"
            slim="$RUNNER_TEMP/requirements-ci.txt"
            struck="$RUNNER_TEMP/requirements-struck.txt"
            both="$RUNNER_TEMP/requirements-sorted.txt"
            # The two the separation brings, and nothing else. torch is
            # not among them because nothing names it: it comes in
            # behind pyannote.audio, and it goes when pyannote.audio
            # does. Whether it really went is not assumed here -- it is
            # asked at the foot of this step, on the machine itself.
            HEAVY="pyannote.audio torchvision"

            dir=$(dirname requirements-dev.txt)
            : > "$flat"
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                -r\ *|--requirement\ *|-r=*|--requirement=*)
                  cat "$dir/${line#*[ =]}" >> "$flat" ;;
                *)
                  printf '%s\n' "$line" >> "$flat" ;;
              esac
            done < requirements-dev.txt
            # One level of "-r" is all there has ever been, and this is
            # what says so rather than assuming it: a second level would
            # otherwise be handed to pip unexpanded, its packages never
            # looked at, and the strike below would pass over them.
            if grep -qE '^[[:space:]]*(-r|--requirement)([[:space:]]|=)' \
               "$flat"; then
              echo "FAIL: a -r line is still standing after"
              echo "      requirements-dev.txt was flattened, so a list"
              echo "      inside a list was not looked at and what it"
              echo "      names has not been held against $HEAVY."
              exit 1
            fi

            # The name is what stands before the version, the extras,
            # the environment marker and any comment -- so pyannote.audio,
            # pyannote.audio>=3.1, pyannote.audio[x] and
            # "pyannote.audio ; sys_platform != 'win32'" are one and the
            # same line to this. Measured here 4.9.2026 against all four
            # spellings.
            # One pass, two answers, and the shell does both redirects.
            # awk must not open a file itself here: RUNNER_TEMP on
            # Windows is D:\a\_temp, and awk reads the backslash in a
            # redirect target as an escape -- measured 5.9.2026, it tried
            # to write to D:_temp and the step died. Reading a path given
            # on the command line is unaffected.
            awk -v heavy="$HEAVY" '
              BEGIN { n = split(heavy, h, " ")
                      for (i = 1; i <= n; i++) drop[tolower(h[i])] = 1 }
              { name = $0
                sub(/#.*$/, "", name)
                sub(/[<>=!~;[].*$/, "", name)
                gsub(/[[:space:]]/, "", name)
                if (tolower(name) in drop) { print "-\t" name; next }
                print "+\t" $0 }
            ' "$flat" > "$both"
            sed -n 's/^-\t//p' "$both" > "$struck"
            sed -n 's/^+\t//p' "$both" > "$slim"

            for name in $HEAVY; do
              if ! grep -qix -- "$name" "$struck"; then
                echo "FAIL: '$name' is to be left out of a run without the"
                echo "      separation, and no line of requirements.txt"
                echo "      names it any more. Either it was renamed or it"
                echo "      is gone. Nothing was left out on its account,"
                echo "      so this run would have installed the whole"
                echo "      list while saying it did not."
                exit 1
              fi
            done
            echo "left out: $(tr '\n' ' ' < "$struck")"
            echo "installing $(grep -c '' "$slim") lines of the" \
                 "$(grep -c '' "$flat") in requirements-dev.txt"
            python -m pip install -r "$slim"
          fi

          python -c "import numpy, PySide6; \
            print('numpy', numpy.__version__); \
            print('PySide6', PySide6.__version__)"
          # Said, not demanded, the way the soxr line is said. Two
          # things are worth reading back from here and nothing else
          # writes them down.
          #
          # Which processor the separation gets is the whole difference
          # between seconds and minutes for voice_split_hears_two.
          # Measured 4.9.2026, Apple M4 Pro, on the 31 s of speech the
          # test uses: 1.4 s of computing on mps against 13.1 s on the
          # processor -- and both found the same six turns with the
          # same worst edge, 0.091 s against the 0.30 s the test
          # allows. So the processor is slower and not wrongly, and a
          # macOS job that suddenly takes minutes longer is read back
          # from this line rather than guessed at.
          #
          # On Windows nothing touches pyannote even with the switch on,
          # because voice_split_hears_two is set aside there for its
          # cost -- so this is the only place there that ever asks
          # whether what was fetched imports at all. That job pays 136 s
          # of installing (measured 4.9.2026 on run 33917380431) for a
          # package no test on it opens, and whether it should keep
          # paying is a question for the owner, not one this file
          # settles.
          #
          # With the switch on, nothing here fails a job: where the
          # import does not come, the test that wants it says so itself
          # and skips. That is weaker than it looks and is written down
          # rather than left standing -- run.sh allows one skip, the
          # suite currently uses none, so a release whose torch quietly
          # failed to import would go green with the separation never
          # run. Making it fail here instead would want six logs read
          # first, to know the import really does come on all six; until
          # somebody has done that, an unmeasured guess must not be what
          # turns releases red.
          #
          # With the switch off the direction turns round, and there the
          # answer is worth a job. The saving is the whole point of the
          # switch, so it is proved on the machine rather than argued
          # for here: nothing of the separation may be installed. If one
          # of the three ever turns up anyway, something else on the
          # list has begun to pull it in, the two minutes are gone, and
          # the run says so instead of going quietly green.
          python - "$SPEAKER_SPLIT" <<'PY'
          import re, sys, time

          wanted = sys.argv[1] == "true"
          HEAVY = ("torch", "torchvision", "pyannote.audio")


          def flat(name):
              """The one spelling a package has, whoever writes it down.

              requirements.txt says pyannote.audio and the installed
              package calls itself pyannote-audio -- measured here
              4.9.2026, and it is exactly the trap this check is against:
              held letter for letter, the name would never match, nothing
              would ever be reported, and the step would pass whatever
              was on the machine. So both sides are flattened the way the
              packaging rule does it, runs of . _ - to one -, lower case.
              """
              return re.sub(r"[-_.]+", "-", name).lower()


          if not wanted:
              import importlib.metadata as md
              heavy = {flat(n) for n in HEAVY}
              here = set()
              for dist in md.distributions():
                  try:
                      name = dist.metadata["Name"] or ""
                  except Exception:
                      continue
                  if name and flat(name) in heavy:
                      here.add(name)
              if here:
                  print("FAIL: this run was started with the speaker")
                  print("      separation off, and %s"
                        % ", ".join(sorted(here)))
                  print("      %s installed all the same. Something else"
                        % ("is" if len(here) == 1 else "are"))
                  print("      on the list now pulls it in, so the two")
                  print("      minutes this switch saves are gone and the")
                  print("      names struck out above are no longer all")
                  print("      of it.")
                  raise SystemExit(1)
              print("separation: not installed, and nothing here needs it")
              raise SystemExit(0)

          began = time.time()
          try:
              import torch
              import pyannote.audio
          except Exception as e:
              print("pyannote: %s: %s" % (e.__class__.__name__, e))
          else:
              where = "cpu"
              for name, ask in (("mps", lambda: torch.backends.mps.is_available()),
                                ("cuda", lambda: torch.cuda.is_available())):
                  try:
                      if ask():
                          where = name
                          break
                  except Exception:
                      pass
              print("pyannote %s, torch %s on %s, imported in %.1f s"
                    % (getattr(pyannote.audio, "__version__", "?"),
                       torch.__version__, where, time.time() - began))
          PY

      # A test that cannot run here is taken out by name, with the reason
      # written beside it, and the count is printed. Nothing is taken out
      # for being red: what is red and could run stays in.
      - name: "Set aside: the tests this machine cannot run"
        shell: bash
        run: |
          # tests/resolve/ is not touched here: those tests need a running
          # DaVinci Resolve and are started by hand with tests/resolve.sh.
          cd tests
          ASIDE="$RUNNER_TEMP/set-aside"
          mkdir -p "$ASIDE"
          : > "$RUNNER_TEMP/aside.txt"
          n=0
          aside() {
            mv "$1_test.py" "$ASIDE/"
            echo "  $1 -- $2"
            echo "$1 -- $2" >> "$RUNNER_TEMP/aside.txt"
            n=$((n+1))
          }
          # The switch first, because it holds on all six and the
          # systems below it do not.
          #
          # voice_split_hears_two is the only test that really runs the
          # separation. The two others that name pyannote work with
          # stand-ins and say so in their own first lines, and the rest
          # of the suite only ever sets VPM_NO_SPEAKER_SPLIT -- so with
          # the switch off, pyannote and torch were never installed and
          # this one test is the whole of what cannot run.
          #
          # Taken out, not left to skip, and that is the rule of this
          # step rather than a preference: run.sh allows one skipped
          # test in the whole suite and the six jobs currently use none
          # of that allowance. A test that quietly spent it would leave
          # the suite green, the barrier used up, and the next test that
          # really did stop checking with nothing left to catch it.
          # Taken out it is counted, named, and printed under the run.
          if [ "$SPEAKER_SPLIT" != "true" ]; then
            aside voice_split_hears_two \
              "this run was started with speaker_split off, so pyannote
               and torch were not installed -- 828 MB and about two
               minutes on each of the six jobs, for the one test that
               uses them. Every release runs it: publish.yml calls this
               workflow with speaker_split true. To run it here, start
               this workflow by hand and turn the switch on."
          fi
          # voice_split_hears_two is no longer in the list below, and
          # the reason it was there has run out rather than been argued
          # away. From 1.9.2026 it was set aside on all six, because
          # the separation then built an environment of its own in the
          # cache at first use -- 218 MB fetched by the program, and a
          # builder must not fetch that. Both halves have since moved:
          # pyannote and torch stand in requirements.txt and go down in
          # "Install: the Python packages" like everything else, and the
          # model travels in git and is held against its manifest three
          # steps up. Nothing is fetched for this test any more.
          #
          # The material used to decide where the test could run, and it
          # does not any more: tests/material/twovoices travels in git.
          # A machine with say(1) speaks the folder afresh and writes it
          # back, a machine without one reads the copy -- so Linux has
          # the two voices now and runs the test like the Mac. Measured
          # 4.9.2026 on run 33890253599, macos-latest / py3.14: the
          # runner built the fixture itself, "twovoices built (Samantha,
          # Daniel)", and finished with 0 of 1 allowed skips.
          #
          # Windows keeps it set aside, and for a new reason: cost, not
          # impossibility. It is the job that sets the queue at 439-467 s
          # against Linux's 213 s (run 33890253599), and pyannote on a
          # Windows CPU is unmeasured. Whoever has a number for it can
          # take the line out.
          case "$RUNNER_OS" in
            Linux)
              aside auphonic_key_kept \
                "it writes into the Windows registry under
                 HKEY_CURRENT_USER. Linux has no registry, so there is
                 nothing here for it to walk."
              ;;
            Windows)
              # Two reasons can reach this one test -- the switch above
              # and Windows' own cost -- and only one of them may be
              # written under the run, or the summary says a thing was
              # taken out twice. The switch spoke first where it holds,
              # and it is the truer reason there: with it off the
              # package is not on the machine at all, so the cost this
              # line weighs was never paid. What is left here is the
              # case where the switch was on.
              if [ -f voice_split_hears_two_test.py ]; then
                aside voice_split_hears_two \
                  "the material reaches this machine now -- it is checked
                   in -- so this is a price, not an impossibility. Windows
                   sets the queue at 439-467 s against Linux's 213 s, and
                   what the separation costs on a Windows CPU has not been
                   measured. Linux runs it; measure this one and it can
                   run here too."
              fi
              aside source_resolve_recalled \
                "it starts run.sh twice as a child and reads the closing
                 block out of it. On Windows the nested run comes back
                 with eleven lines and no summary at all, and the count
                 answers -1 -- measured on run 33532148965, both Python
                 versions. What it holds is a line run.sh prints, not
                 anything the program does, so it is set aside here
                 rather than weakened everywhere."
              aside sound_one_pass_agrees \
                "it puts a stand-in ffmpeg on PATH as a file with a
                 #!/bin/sh line and an execute bit. Windows runs neither,
                 so the real ffmpeg answers and the check cannot fire."
              aside files_named_by_folder \
                "it asks what /Volumes/Recordings is called. /Volumes is
                 the macOS shape of a volume root; Windows has none."
              ;;
            macOS)
              aside voice_words_intact \
                "it has macOS recognise a German sentence. The runner
                 carries no German dictation asset, so the program falls
                 back -- correctly -- and the test asks for the macOS way."
              aside auphonic_key_kept \
                "it walks the Windows registry. On a Mac those same
                 three functions go to the keychain, and the keychain
                 holds the real Auphonic key -- no test goes there."
              ;;
          esac
          echo "set aside on $RUNNER_OS: $n"

      - name: "Run: the test suite"
        shell: bash
        run: |
          cd tests
          start=$SECONDS
          set +e
          # Windows ran one test at a time from 29.8.2026, because five
          # windows at once there ended in an access violation inside
          # Qt -- no Python frame in it, a different test each time,
          # five of seven runs.
          #
          # Taken off again the same day, as a measurement: four of the
          # time_length_is_in_to_out tests were deleting a camera file while three players
          # still had it open, and one of the four is files_block_out_and_back,
          # which is where the access violation showed most. They let go
          # first now. If that was the cause, Windows comes through
          # beside the others again -- and it costs a minute instead of
          # five. If the crash returns, this line comes back and the
          # suspicion is wrong.
          bash run.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"
          rc=${PIPESTATUS[0]}
          echo "the suite took $(( SECONDS - start )) s"
          exit $rc

      # What a reader wants at a glance: which ffmpeg, how many ran, how
      # many were taken out and which, how many checked nothing, and what
      # is red.
      - name: "Report: the run in five lines"
        if: always()
        shell: bash
        run: |
          S="$RUNNER_TEMP/suite.log"
          # The number is counted here, not written down: a number that
          # is kept by hand is wrong again with the next new test. The
          # ones set aside were moved out of tests/, so what is still in
          # the folder is what ran, and the two added together are all
          # there are. run.sh picks its tests up out of the same folder
          # with the same pattern, so this counts what it ran.
          #
          # Counted by the shell itself. find(1) would be shorter, but
          # on Windows the name reaches Windows' own find, which is a
          # different program.
          ran=0
          for f in tests/*_test.py; do
            if [ -e "$f" ]; then ran=$((ran + 1)); fi
          done
          out=0
          if [ -s "$RUNNER_TEMP/aside.txt" ]; then
            out=$(wc -l < "$RUNNER_TEMP/aside.txt" | tr -d ' ')
          fi
          {
            echo "## ${{ matrix.os }} / Python ${{ matrix.python }}"
            echo
            echo '```'
            python -VV
            # In the same words as the run's own name, so a reader who
            # comes here from the list of runs finds the same sentence
            # rather than having to work out that they mean each other.
            if [ "$SPEAKER_SPLIT" = "true" ]; then
              echo "separation: on  -- pyannote and torch installed"
            else
              echo "separation: off -- pyannote and torch not installed"
            fi
            cat "$RUNNER_TEMP/ffmpeg.txt" 2>/dev/null || echo "ffmpeg:"\
              "the run did not get as far as saying"
            grep -E "^green:" "$S" 2>/dev/null || echo "the suite did not"\
              "get as far as a summary"
            # The barrier on tests that checked nothing is run.sh's: it
            # knows the tests, it counts them, and it already returns
            # non-zero when the number rises. Nothing is counted or held
            # again here -- the line is only lifted where a reader will
            # see it without opening the log.
            grep -E "^skips:" "$S" 2>/dev/null || true
            echo '```'
            if [ "$out" -gt 0 ]; then
              echo "Of $((ran + out)) tests, $ran ran. Taken out, because"\
                "this machine cannot run them ($out):"
              echo
              while read -r l; do echo "* $l"; done \
                < "$RUNNER_TEMP/aside.txt"
            else
              echo "Nothing was taken out: all $ran tests ran."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # run.sh prints up to twelve lines per red test, ranked so the line
      # that sums the test up comes first. That is a good deal, and still
      # a selection. The whole output says which caption, which channel,
      # which file -- and that is what somebody reading this from another
      # machine needs.
      - name: "Report: every failed test, in full"
        if: failure()
        shell: bash
        run: |
          cd tests
          # The conditions come from the job's env: block above and reach
          # this step by themselves. They used to be typed out again here,
          # and the copy had already fallen behind by two -- so a red test
          # repeated here ran under conditions the suite never had.
          #
          # Two cannot be inherited: run.sh makes a cache folder and a
          # temporary folder of its own for each run and deletes both when
          # it exits, so by now they are gone. They are made again here the
          # same way rather than left pointing at nothing.
          export VPM_CACHE="$RUNNER_TEMP/again-cache"
          export TMPDIR="$RUNNER_TEMP/again-temp"
          mkdir -p "$VPM_CACHE" "$TMPDIR"
          echo "under: LANGUAGE=$LANGUAGE VPM_SILENT=$VPM_SILENT" \
            "VPM_NO_SPEAKER_SPLIT=$VPM_NO_SPEAKER_SPLIT" \
            "VPM_NO_UPDATE_CHECK=$VPM_NO_UPDATE_CHECK"
          echo "       VPM_MEDIA=$VPM_MEDIA"
          # Nothing to read where the suite never started, and the
          # step runs under set -e: without this, sed dies on the
          # missing file and this step becomes the error the job
          # reports -- burying the step that really fell. Measured on
          # 5.9.2026: an outage at the package server the ffmpeg step
          # fetches from (504) ended as "sed: can't read
          # D:\a\_temp/suite.log", and the 504 was five hundred lines up.
          log="$RUNNER_TEMP/suite.log"
          if [ ! -f "$log" ]; then
            echo "no suite.log, so the suite never started. What fell is"
            echo "a step above this one -- read that one, not this."
            exit 0
          fi
          names=$(sed -n 's/^green:.*red: [0-9]*//p' "$log")
          # Unquoted on purpose: word splitting collapses the run of
          # blanks that line ends in. Since run.sh began going red for
          # more skips than it allows, the suite can fail with "red: 0"
          # and no name at all -- and blanks are not empty, so without
          # this the step below printed nothing and said nothing.
          names=$(echo $names)
          if [ -z "$names" ]; then
            echo "no red test names in the summary. Either the suite"
            echo "stopped before it got that far, or it went red without"
            echo "a red test -- the skips line in the summary says so."
            exit 0
          fi
          for t in $names; do
            echo "===================== $t ====================="
            # A red test returns non-zero, and the step runs under
            # set -eo pipefail: without this the second one is never read.
            python "${t}_test.py" 2>&1 | tail -70 || true
            echo
          done
