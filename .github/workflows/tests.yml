name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'

    env:
      VPM_PYTHON: python
      QT_QPA_PLATFORM: offscreen
      VPM_FIXTURES: /tmp/vpm-fixtures-ci
      # Windows hands Python a cp1252 stdout, and a caption with a box
      # or a tick in it then stops the test that prints it.
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: what is on this machine
        shell: bash
        run: |
          echo "runner:  $RUNNER_OS $RUNNER_ARCH"
          echo "python:  $(python -VV)"
          echo "cores:   $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo '?')"
          echo "bash:    $BASH_VERSION"
          echo "id -u:   $(id -u 2>&1 || echo '?')"
          for t in ffmpeg ffprobe timeout gtimeout; do
            if command -v "$t" > /dev/null 2>&1; then
              echo "$t: $(command -v $t)"
            else
              echo "$t: NOT THERE"
            fi
          done

      # Git for Windows rewrites text files to CRLF on checkout. The model
      # beside the program carries a manifest of SHA-256 sums, and one of
      # the five files it names is text.
      - name: what the checkout did to the model
        shell: bash
        run: |
          M=models/speaker-diarization-community-1
          echo "core.autocrlf: $(git config --get core.autocrlf || echo '(unset)')"
          python -c "import hashlib,sys; \
            print('config.yaml as it lies here:', \
              hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" \
            "$M/config.yaml"
          echo -n "the manifest says:                    "
          grep -E "^[0-9a-f]{64}  config\.yaml" "$M/SHA256SUMS.txt" \
            | awk '{print $1}'

      - name: lay the files down as they were committed
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git rm --cached -r -q .
          git reset --hard -q
          M=models/speaker-diarization-community-1
          python -c "import hashlib,sys; \
            print('config.yaml now:', \
              hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" \
            "$M/config.yaml"

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          command -v ffmpeg > /dev/null 2>&1 || brew install ffmpeg

      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          command -v ffmpeg > /dev/null 2>&1 \
            || choco install ffmpeg -y --no-progress

      - name: what Qt needs on a machine without a screen (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxcb-xinerama0 \
            libfontconfig1 libfreetype6

      - name: the packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -c "import numpy, PySide6; \
            print('numpy', numpy.__version__); \
            print('PySide6', PySide6.__version__)"

      # A test that cannot run here is taken out by name, with the reason
      # written beside it, and the count is printed. Nothing is taken out
      # for being red: what is red and could run stays in.
      - name: what this machine cannot run
        shell: bash
        run: |
          cd tests
          ASIDE="$RUNNER_TEMP/set-aside"
          mkdir -p "$ASIDE"
          n=0
          aside() { mv "$1_test.py" "$ASIDE/"; echo "  $1 -- $2"; n=$((n+1)); }
          case "$RUNNER_OS" in
            Windows)
              aside channel_read \
                "it puts a stand-in ffmpeg on PATH as a file with a
                 #!/bin/sh line and an execute bit. Windows runs neither,
                 so the real ffmpeg answers and the check cannot fire."
              aside folder_name \
                "it asks what /Volumes/Recordings is called. /Volumes is
                 the macOS shape of a volume root; Windows has none."
              ;;
            macOS)
              aside speech \
                "it has macOS recognise a German sentence. The runner
                 carries no German dictation asset, so the program falls
                 back -- correctly -- and the test asks for the macOS way."
              ;;
          esac
          echo "set aside on $RUNNER_OS: $n"

      - name: the suite
        shell: bash
        run: |
          cd tests
          start=$SECONDS
          set +e
          bash run.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"
          rc=${PIPESTATUS[0]}
          echo "the suite took $(( SECONDS - start )) s"
          exit $rc

      # run.sh prints four lines per red test. The whole output of a red
      # test says which caption, which channel, which file -- and that is
      # what somebody reading this from another machine needs.
      - name: the red ones, in full
        if: failure()
        shell: bash
        run: |
          cd tests
          export LANG=C LC_ALL=C LANGUAGE=en
          export VPM_SILENT=1 VPM_NO_SPEAKER_SPLIT=1 VPM_NO_UPDATE_CHECK=1
          export VPM_MEDIA="$VPM_FIXTURES/interview"
          names=$(sed -n 's/^green:.*red: [0-9]*//p' "$RUNNER_TEMP/suite.log")
          if [ -z "$names" ]; then
            echo "no red test names in the summary -- the suite itself"
            echo "stopped before it got that far."
            exit 0
          fi
          for t in $names; do
            echo "===================== $t ====================="
            # A red test returns non-zero, and the step runs under
            # set -eo pipefail: without this the second one is never read.
            python "${t}_test.py" 2>&1 | tail -70 || true
            echo
          done
