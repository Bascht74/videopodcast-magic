name: tests

# The commit subject is what GitHub calls a run by default, so the list
# of runs reads as a heap of unrelated sentences. A run is one thing --
# the suite, on a commit -- and it says so, in the same shape every
# time, with the number the list is ordered by.
run-name: "suite #${{ github.run_number }} on ${{ github.ref_name }}"

on:
  # Branches only. A tag points at a commit the suite has already
  # answered for, and a second run of it says nothing new.
  push:
    branches:
      - '**'
  pull_request:
  # Nothing here is pinned: requirements.txt names numpy and PySide6
  # without a version, ffmpeg is whatever the package service has that
  # day, and the Python patch levels move under setup-python. So a green
  # main can go bad without anybody pushing anything. Once a week it is
  # asked again. Monday morning, and not on the hour: that is when the
  # whole world's cron jobs start at once and the runners queue.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
# The event is part of the group, or the weekly run would be cancelled
# by the first push of the week -- which is the one week it is there for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two versions on all three systems. 3.14 is the one the suite
        # runs on at home; 3.10 is the floor the program names for
        # itself in NEEDS_PYTHON, and a floor that is only ever walked
        # on Linux is not a floor. What breaks between 3.10 and 3.14
        # -- a path, an encoding, a Qt plugin -- breaks on Windows and
        # macOS, so that is where it has to be walked.
        #
        # On Windows and macOS '3.10' comes out as 3.10.11: that is the
        # last 3.10 CPython released as a binary, and setup-python
        # builds newer ones from source for Linux only. Linux therefore
        # runs a later 3.10 than the other two. That is the truth of the
        # matter for anyone out there on 3.10 as well.
        include:
          - os: ubuntu-latest
            python: '3.14'
          - os: ubuntu-latest
            python: '3.10'
          - os: windows-latest
            python: '3.14'
          - os: windows-latest
            python: '3.10'
          - os: macos-latest
            python: '3.14'
          - os: macos-latest
            python: '3.10'

    env:
      VPM_PYTHON: python
      QT_QPA_PLATFORM: offscreen
      VPM_FIXTURES: /tmp/vpm-fixtures-ci
      # The same folder again, and it has to stay the same: run.sh would
      # work this out for itself, but saying it here means the suite and
      # the step that repeats a red test read it from one place.
      VPM_MEDIA: /tmp/vpm-fixtures-ci/interview
      # Windows hands Python a cp1252 stdout, and a caption with a box
      # or a tick in it then stops the test that prints it.
      PYTHONUTF8: '1'

      # The conditions the suite runs under, in one place. run.sh exports
      # the same six itself, with the same values, so the suite is
      # unchanged by their standing here -- but now every other step in
      # the job inherits them too, and "the red ones, in full" no longer
      # keeps a second list of its own that can fall behind. English is
      # the source language of the program and LANGUAGE is the first name
      # it looks at; the rest keep the suite from making noise, fetching
      # a 218 MB model, or asking github.com about updates.
      LANG: C
      LC_ALL: C
      LANGUAGE: en
      VPM_SILENT: '1'
      VPM_NO_SPEAKER_SPLIT: '1'
      VPM_NO_UPDATE_CHECK: '1'

    steps:
      - uses: actions/checkout@v5

      # Both lists, and that is the whole point. The key of the pip cache
      # is a hash over the files named here, and requirements-dev.txt is
      # two lines: "-r requirements.txt" and pyspellchecker. Every package
      # the program really needs stands in the other file, which the key
      # never looked at -- so a package added over there left the key
      # unchanged, the primary key hit, and a hit is exactly the case in
      # which nothing is written back. The wheels were fetched again on
      # every run, for ever, and the cache stayed at the state of
      # 22.8.2026, the last day requirements-dev.txt itself changed.
      #
      # Measured 4.9.2026 on run 33890253599: "Cache hit occurred on the
      # primary key ..., not saving cache" in all six jobs, seven wheels
      # re-fetched on Linux and six on Windows -- the ones faster-whisper
      # brought in that morning. The key in that log is
      # 4f0debf968642fc2..., and hashing requirements-dev.txt alone here
      # gives the same digits, which is how the cause was pinned down
      # rather than guessed.
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt

      # Git for Windows rewrites text files to CRLF on checkout. The model
      # beside the program carries a manifest of SHA-256 sums, and one of
      # the five files it names is text.
      - name: "Check out: verify the speaker model survived it"
        shell: bash
        run: |
          M=videopodcast_magic/models/speaker-diarization-community-1
          echo "core.autocrlf: $(git config --get core.autocrlf || echo '(unset)')"
          python -c "import hashlib,sys; \
            print('config.yaml as it lies here:', \
              hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" \
            "$M/config.yaml"
          echo -n "the manifest says:                    "
          grep -E "^[0-9a-f]{64}  config\.yaml" "$M/SHA256SUMS.txt" \
            | awk '{print $1}'

      - name: "Check out: restore the model files byte for byte"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          git config core.autocrlf false
          git rm --cached -r -q .
          git reset --hard -q
          M=videopodcast_magic/models/speaker-diarization-community-1
          python -c "import hashlib,sys; \
            print('config.yaml now:', \
              hashlib.sha256(open(sys.argv[1],'rb').read()).hexdigest())" \
            "$M/config.yaml"

      # The two steps above print a hash and throw it away. Here the
      # manifest is actually held against the files -- all five it names,
      # not only the one that is text -- and a difference stops the job.
      # After the Windows repair, so what is judged is what the suite
      # will read.
      - name: "Check out: hold the model against its manifest"
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, re, sys
          M = "videopodcast_magic/models/speaker-diarization-community-1"
          manifest = os.path.join(M, "SHA256SUMS.txt")
          # Text mode, so a CRLF the checkout may have left behind does
          # not end up inside the file name.
          with open(manifest, encoding="utf-8") as f:
              want = re.findall(r"(?m)^([0-9a-f]{64})  (\S.*)$", f.read())
          if not want:
              sys.exit("FAIL: %s names no file at all" % manifest)
          bad = 0
          for digest, name in want:
              path = os.path.join(M, name)
              if not os.path.exists(path):
                  print("  %-30s FAIL not there" % name)
                  bad += 1
                  continue
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              if h.hexdigest() == digest:
                  print("  %-30s ok   %d bytes" % (name, os.path.getsize(path)))
              else:
                  print("  %-30s FAIL %s" % (name, h.hexdigest()))
                  bad += 1
          print("%d files named, %d wrong" % (len(want), bad))
          sys.exit(1 if bad else 0)
          PY

      # apt is the bottleneck here, not the platform: Ubuntu 24.04
      # carries ffmpeg 6.1.1, under the floor this program names, and
      # nothing newer is in its archive. A static build settles it in
      # half a minute -- and it is the one of the three runners that
      # carries soxr, so the fine clock correction is exercised
      # somewhere. macOS takes what brew gives once its own formula
      # index has been refreshed (9.0.1, no soxr) and Windows what choco
      # gives (9.0.1): three runners, and both paths through the drift
      # correction.
      - name: "Install: ffmpeg (Linux)"
        if: runner.os == 'Linux'
        run: |
          set -e
          base=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest
          name=ffmpeg-n9.0-latest-linux64-gpl-9.0
          curl -fsSL --retry 3 -o /tmp/ff.tar.xz "$base/$name.tar.xz"
          tar -xJf /tmp/ff.tar.xz -C /tmp
          sudo install -m755 "/tmp/$name/bin/ffmpeg" "/tmp/$name/bin/ffprobe" \
                             /usr/local/bin/
          ffmpeg -version | head -1
          # Said, not demanded. soxr decides how finely the clock drift
          # between cameras comes out -- 0.21 ppm against 21 -- and
          # coarser is not broken, so a build without it must not fail a
          # job. It is printed because a run that behaves oddly in the
          # drift correction is read back from here.
          ffmpeg -version | tr ' ' '\n' | grep -q enable-libsoxr \
            && echo "soxr:   yes" || echo "soxr:   no"

      - name: "Install: ffmpeg and a time limit (macOS)"
        if: runner.os == 'macOS'
        run: |
          set -e
          # Not "only if none is there": what counts is the version and
          # not the presence. The bottle is poured in seconds; no build.
          #
          # brew update first, and that is the whole of the difference.
          # The runner image carries a Homebrew whose formula index is
          # frozen at the day the image was built, and nothing refreshes
          # it by itself. Measured 4.9.2026 out of the last green run:
          # brew fetched the manifest for 8.1.2_1, printed no
          # "Auto-updating" line anywhere in the run, and homebrew/core
          # had 9.0.1 that same hour.
          #
          # Nothing on these three lines decides anything, and that is
          # on purpose: a bad minute at github.com must not be a red
          # suite. They are said and walked past, and what judges is the
          # version at the foot of this step -- which is a better line
          # to read than a brew error, because it names what was wanted
          # and what is there.
          brew update || brew update \
            || echo "brew update did not run -- the check below decides"
          brew install ffmpeg || brew upgrade ffmpeg \
            || echo "brew could not put ffmpeg down -- likewise"
          ffmpeg -version | sed -n 1p
          # Said, not demanded, the way the Linux step says it. soxr
          # decides how finely the clock drift between cameras comes
          # out and coarser is not broken; homebrew/core builds without
          # it in every version. The owner, 4.9.2026: on the build
          # machines a version without soxr is taken even in case of
          # doubt -- for the tests that is fine. A hard soxr check here
          # would be a mine: Linux goes red the day BtbN changes its
          # build.
          ffmpeg -version | tr ' ' '\n' | grep -q enable-libsoxr \
            && echo "soxr:   yes" || echo "soxr:   no"

          # And now the step is held to what it just claimed to do.
          # It used to end in "|| true", which swallowed every failure:
          # the whole line could fail and the job walked on green. That
          # is why this Mac sat on 8.1.2 for weeks while the other two
          # runners were on 9.0.1 and nobody saw it -- a version was
          # printed, and a printed version is read by nobody.
          #
          # No version number is written here. brew is asked what its
          # formula names and what it actually put down, so the day the
          # formula moves this rises by itself and no second place has
          # to be remembered. Two questions, and they fail differently:
          # a stale index leaves formula and keg apart, something
          # earlier on PATH leaves keg and the answering binary apart.
          formula=$(brew info --json=v2 --formula ffmpeg \
            | python -c "import json, sys; print(json.load(sys.stdin) \
                ['formulae'][0]['versions']['stable'])") || formula=""
          keg=$(brew list --versions ffmpeg | awk '{print $2}') || keg=""
          said=$(ffmpeg -version | sed -n 1p \
                 | sed -n 's/^ffmpeg version n\{0,1\}\([0-9][0-9.]*\).*/\1/p')
          echo "formula: ${formula:-?}  installed: ${keg:-?}  answering: ${said:-?}"
          bad=0
          if [ -z "$formula" ] || [ "${keg%%_*}" != "$formula" ]; then
            bad=1
            echo "FAIL: homebrew/core names ffmpeg ${formula:-nothing} and"
            echo "      brew put down ${keg:-nothing}. Either the formula"
            echo "      index is still stale after brew update, or the"
            echo "      install did not take. Nothing below this line has"
            echo "      been run against the ffmpeg this suite needs."
          fi
          if [ -z "$said" ] || [ "$said" != "${keg%%_*}" ]; then
            bad=1
            echo "FAIL: brew put down ${keg:-nothing} and the ffmpeg that"
            echo "      answers says ${said:-nothing}. The one that"
            echo "      answers is $(command -v ffmpeg || echo 'nowhere on PATH')."
            echo "      Either nothing was installed at all, or"
            echo "      something ahead of /opt/homebrew/bin on PATH is"
            echo "      being asked instead of what was installed."
          fi
          [ "$bad" = "0" ] || exit 1
          # macOS brings no timeout(1), and run.sh says so and then runs
          # the tests unguarded. One test that hangs there sits until the
          # job's thirty minutes are up and leaves nothing behind. GNU
          # coreutils installs the same program under the name gtimeout,
          # which is the second name run.sh looks for.
          command -v gtimeout > /dev/null 2>&1 || brew install coreutils
          if ! command -v gtimeout > /dev/null 2>&1; then
            echo "coreutils is installed but gtimeout is not on PATH --"
            echo "without it the suite runs here with no time limit, so"
            echo "this stops now rather than later. brew link coreutils."
            exit 1
          fi

      - name: "Install: ffmpeg (Windows)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          command -v ffmpeg > /dev/null 2>&1 \
            || choco install ffmpeg -y --no-progress

      - name: "Install: what Qt needs without a screen (Linux)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xkb1 libxcb-xinerama0 \
            libfontconfig1 libfreetype6 libpulse0
          # libpulse0 is named here because QtMultimedia loads it and
          # dies without it. It used to arrive as a by-catch of
          # apt-get install ffmpeg; the static build brought that to
          # light by not dragging it along. A dependency nobody names
          # is one nobody can miss until it is gone.

      # Here, and not before the installations. Asked before them, this
      # step answered "ffmpeg: NOT THERE" in every job that has ever run
      # here -- true, and of no use to anybody. What is wanted is the
      # ffmpeg the suite is about to run against. A defect that hangs on
      # an ffmpeg version leaves no trace otherwise, and this house has
      # had one: the colour tags in ffmpeg 9.
      - name: "Record: the versions this run used"
        shell: bash
        run: |
          echo "runner:  $RUNNER_OS $RUNNER_ARCH"
          echo "python:  $(python -VV)"
          echo "cores:   $(getconf _NPROCESSORS_ONLN 2>/dev/null || echo '?')"
          echo "bash:    $BASH_VERSION"
          echo "id -u:   $(id -u 2>&1 || echo '?')"
          for t in ffmpeg ffprobe timeout gtimeout; do
            if command -v "$t" > /dev/null 2>&1; then
              echo "$t: $(command -v $t)"
            else
              echo "$t: NOT THERE"
            fi
          done
          # sed rather than head: head closes the pipe early, and under
          # pipefail that turns a good ffmpeg into a failed step.
          ffmpeg -version 2>&1 | sed -n 1p > "$RUNNER_TEMP/ffmpeg.txt"
          cat "$RUNNER_TEMP/ffmpeg.txt"
          ffprobe -version 2>&1 | sed -n 1p

      - name: "Install: the Python packages"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -c "import numpy, PySide6; \
            print('numpy', numpy.__version__); \
            print('PySide6', PySide6.__version__)"
          # Said, not demanded, the way the soxr line is said. Two
          # things are worth reading back from here and nothing else
          # writes them down.
          #
          # Which processor the separation gets is the whole difference
          # between seconds and minutes for voice_split_hears_two.
          # Measured 4.9.2026, Apple M4 Pro, on the 31 s of speech the
          # test uses: 1.4 s of computing on mps against 13.1 s on the
          # processor -- and both found the same six turns with the
          # same worst edge, 0.091 s against the 0.30 s the test
          # allows. So the processor is slower and not wrongly, and a
          # macOS job that suddenly takes minutes longer is read back
          # from this line rather than guessed at.
          #
          # And on Linux and Windows no test touches pyannote at all,
          # while the two of them fetch a torch of 529 MB and 118 MB
          # for it (measured off the package index the same day). This
          # is the only place there that ever asks whether what was
          # fetched imports.
          #
          # Nothing here fails a job: where the import does not come,
          # the test that wants it says so itself and skips.
          python - <<'PY'
          import time
          began = time.time()
          try:
              import torch
              import pyannote.audio
          except Exception as e:
              print("pyannote: %s: %s" % (e.__class__.__name__, e))
          else:
              where = "cpu"
              for name, ask in (("mps", lambda: torch.backends.mps.is_available()),
                                ("cuda", lambda: torch.cuda.is_available())):
                  try:
                      if ask():
                          where = name
                          break
                  except Exception:
                      pass
              print("pyannote %s, torch %s on %s, imported in %.1f s"
                    % (getattr(pyannote.audio, "__version__", "?"),
                       torch.__version__, where, time.time() - began))
          PY

      # A test that cannot run here is taken out by name, with the reason
      # written beside it, and the count is printed. Nothing is taken out
      # for being red: what is red and could run stays in.
      - name: "Set aside: the tests this machine cannot run"
        shell: bash
        run: |
          # tests/resolve/ is not touched here: those tests need a running
          # DaVinci Resolve and are started by hand with tests/resolve.sh.
          cd tests
          ASIDE="$RUNNER_TEMP/set-aside"
          mkdir -p "$ASIDE"
          : > "$RUNNER_TEMP/aside.txt"
          n=0
          aside() {
            mv "$1_test.py" "$ASIDE/"
            echo "  $1 -- $2"
            echo "$1 -- $2" >> "$RUNNER_TEMP/aside.txt"
            n=$((n+1))
          }
          # voice_split_hears_two is no longer in this list, and the
          # reason it was here has run out rather than been argued
          # away. From 1.9.2026 it was set aside on all six, because
          # the separation then built an environment of its own in the
          # cache at first use -- 218 MB fetched by the program, and a
          # builder must not fetch that. Both halves have since moved:
          # pyannote and torch stand in requirements.txt and go down in
          # "Install: the Python packages" like everything else, and the
          # model travels in git and is held against its manifest three
          # steps up. Nothing is fetched for this test any more.
          #
          # What is left is the material, and it decides where the test
          # can run. The two voices are really spoken, by say(1), which
          # only macOS has -- so it is set aside under Linux and Windows
          # below, and runs here on the Mac. Measured 4.9.2026 on run
          # 33890253599, macos-latest / py3.14: the runner built the
          # fixture itself, "twovoices built (Samantha, Daniel)", and
          # finished with 0 of 1 allowed skips.
          case "$RUNNER_OS" in
            Linux)
              aside voice_split_hears_two \
                "it separates a recording of two voices really spoken,
                 and say(1) writes them -- macOS only. Here the fixture
                 is not built and the test would skip, spending the
                 run's one allowance on a test that was never going to
                 run."
              aside auphonic_key_kept \
                "it writes into the Windows registry under
                 HKEY_CURRENT_USER. Linux has no registry, so there is
                 nothing here for it to walk."
              ;;
            Windows)
              aside voice_split_hears_two \
                "the same as on Linux: the two voices it listens to are
                 spoken by say(1), and Windows has no say(1), so the
                 fixture holding them is never built here."
              aside source_resolve_recalled \
                "it starts run.sh twice as a child and reads the closing
                 block out of it. On Windows the nested run comes back
                 with eleven lines and no summary at all, and the count
                 answers -1 -- measured on run 33532148965, both Python
                 versions. What it holds is a line run.sh prints, not
                 anything the program does, so it is set aside here
                 rather than weakened everywhere."
              aside sound_one_pass_agrees \
                "it puts a stand-in ffmpeg on PATH as a file with a
                 #!/bin/sh line and an execute bit. Windows runs neither,
                 so the real ffmpeg answers and the check cannot fire."
              aside files_named_by_folder \
                "it asks what /Volumes/Recordings is called. /Volumes is
                 the macOS shape of a volume root; Windows has none."
              ;;
            macOS)
              aside voice_words_intact \
                "it has macOS recognise a German sentence. The runner
                 carries no German dictation asset, so the program falls
                 back -- correctly -- and the test asks for the macOS way."
              aside auphonic_key_kept \
                "it walks the Windows registry. On a Mac those same
                 three functions go to the keychain, and the keychain
                 holds the real Auphonic key -- no test goes there."
              ;;
          esac
          echo "set aside on $RUNNER_OS: $n"

      - name: "Run: the test suite"
        shell: bash
        run: |
          cd tests
          start=$SECONDS
          set +e
          # Windows ran one test at a time from 29.8.2026, because five
          # windows at once there ended in an access violation inside
          # Qt -- no Python frame in it, a different test each time,
          # five of seven runs.
          #
          # Taken off again the same day, as a measurement: four of the
          # time_length_is_in_to_out tests were deleting a camera file while three players
          # still had it open, and one of the four is files_block_out_and_back,
          # which is where the access violation showed most. They let go
          # first now. If that was the cause, Windows comes through
          # beside the others again -- and it costs a minute instead of
          # five. If the crash returns, this line comes back and the
          # suspicion is wrong.
          bash run.sh 2>&1 | tee "$RUNNER_TEMP/suite.log"
          rc=${PIPESTATUS[0]}
          echo "the suite took $(( SECONDS - start )) s"
          exit $rc

      # What a reader wants at a glance: which ffmpeg, how many ran, how
      # many were taken out and which, how many checked nothing, and what
      # is red.
      - name: "Report: the run in five lines"
        if: always()
        shell: bash
        run: |
          S="$RUNNER_TEMP/suite.log"
          # The number is counted here, not written down: a number that
          # is kept by hand is wrong again with the next new test. The
          # ones set aside were moved out of tests/, so what is still in
          # the folder is what ran, and the two added together are all
          # there are. run.sh picks its tests up out of the same folder
          # with the same pattern, so this counts what it ran.
          #
          # Counted by the shell itself. find(1) would be shorter, but
          # on Windows the name reaches Windows' own find, which is a
          # different program.
          ran=0
          for f in tests/*_test.py; do
            if [ -e "$f" ]; then ran=$((ran + 1)); fi
          done
          out=0
          if [ -s "$RUNNER_TEMP/aside.txt" ]; then
            out=$(wc -l < "$RUNNER_TEMP/aside.txt" | tr -d ' ')
          fi
          {
            echo "## ${{ matrix.os }} / Python ${{ matrix.python }}"
            echo
            echo '```'
            python -VV
            cat "$RUNNER_TEMP/ffmpeg.txt" 2>/dev/null || echo "ffmpeg:"\
              "the run did not get as far as saying"
            grep -E "^green:" "$S" 2>/dev/null || echo "the suite did not"\
              "get as far as a summary"
            # The barrier on tests that checked nothing is run.sh's: it
            # knows the tests, it counts them, and it already returns
            # non-zero when the number rises. Nothing is counted or held
            # again here -- the line is only lifted where a reader will
            # see it without opening the log.
            grep -E "^skips:" "$S" 2>/dev/null || true
            echo '```'
            if [ "$out" -gt 0 ]; then
              echo "Of $((ran + out)) tests, $ran ran. Taken out, because"\
                "this machine cannot run them ($out):"
              echo
              while read -r l; do echo "* $l"; done \
                < "$RUNNER_TEMP/aside.txt"
            else
              echo "Nothing was taken out: all $ran tests ran."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # run.sh prints up to twelve lines per red test, ranked so the line
      # that sums the test up comes first. That is a good deal, and still
      # a selection. The whole output says which caption, which channel,
      # which file -- and that is what somebody reading this from another
      # machine needs.
      - name: "Report: every failed test, in full"
        if: failure()
        shell: bash
        run: |
          cd tests
          # The conditions come from the job's env: block above and reach
          # this step by themselves. They used to be typed out again here,
          # and the copy had already fallen behind by two -- so a red test
          # repeated here ran under conditions the suite never had.
          #
          # Two cannot be inherited: run.sh makes a cache folder and a
          # temporary folder of its own for each run and deletes both when
          # it exits, so by now they are gone. They are made again here the
          # same way rather than left pointing at nothing.
          export VPM_CACHE="$RUNNER_TEMP/again-cache"
          export TMPDIR="$RUNNER_TEMP/again-temp"
          mkdir -p "$VPM_CACHE" "$TMPDIR"
          echo "under: LANGUAGE=$LANGUAGE VPM_SILENT=$VPM_SILENT" \
            "VPM_NO_SPEAKER_SPLIT=$VPM_NO_SPEAKER_SPLIT" \
            "VPM_NO_UPDATE_CHECK=$VPM_NO_UPDATE_CHECK"
          echo "       VPM_MEDIA=$VPM_MEDIA"
          names=$(sed -n 's/^green:.*red: [0-9]*//p' "$RUNNER_TEMP/suite.log")
          # Unquoted on purpose: word splitting collapses the run of
          # blanks that line ends in. Since run.sh began going red for
          # more skips than it allows, the suite can fail with "red: 0"
          # and no name at all -- and blanks are not empty, so without
          # this the step below printed nothing and said nothing.
          names=$(echo $names)
          if [ -z "$names" ]; then
            echo "no red test names in the summary. Either the suite"
            echo "stopped before it got that far, or it went red without"
            echo "a red test -- the skips line in the summary says so."
            exit 0
          fi
          for t in $names; do
            echo "===================== $t ====================="
            # A red test returns non-zero, and the step runs under
            # set -eo pipefail: without this the second one is never read.
            python "${t}_test.py" 2>&1 | tail -70 || true
            echo
          done
