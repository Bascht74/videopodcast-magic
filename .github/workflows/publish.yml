name: publish

# The commit subject is what GitHub calls a run by default, so the list
# of runs reads as a heap of unrelated sentences. A run of this one is
# one thing -- a release, off one branch, under one title -- and it says
# so, with the number the list is ordered by.
#
# "separation on" is not decoration and it is not a variable. Since
# 4.9.2026 an ordinary push runs the suite without the speaker
# separation, and the six jobs of a release run look the same in the
# list as the six of a push. The suite this file calls appears under no
# run of its own, so this line is the only place a reader ever sees
# which of the two a release had -- and it is always the whole one,
# which is why it can be written out flat.
run-name: "publish #${{ github.run_number }} from ${{ github.ref_name }}, separation on: ${{ inputs.title }}"

# Making the release, once everything a release stands on is true.
#
# Until today the tag was pushed by hand and the release made by hand
# beside it, out of the recipe in .claude/skills/freigabe/SKILL.md.
# That recipe is still the source for every command in here -- the four
# exclusions of the archive, the manifest beside it, the awk over the
# changelog, the spelling of the tag. What has changed is who types
# them. Nobody does. One word, one run, and either a release or a
# reason.
#
# The division of labour with .github/workflows/release.yml is the
# whole design of this file, and it is not "what is checked where" but
# "when":
#
#   this file answers BEFORE the tag exists, and every check in it is
#   one that would otherwise make a tag that cannot be taken back;
#
#   release.yml answers AFTER the release is published, and judges the
#   release that is now standing there -- the archive against the tree
#   at the tag byte for byte, the notes against the changelog, the
#   addresses the program updates itself from, that it installs and
#   answers.
#
# So nothing that release.yml asks is asked here a second time, except
# where its answer would come too late to be of any use. Those places
# are marked, one by one, with the word "too late" and the reason.
#
# The suite is called from here as a workflow_call, and tests.yml
# carries the trigger for it. The first build of this file asked the API
# instead, whether somebody had run the suite on this commit -- and that
# question can never be answered: a workflow called with uses: is part
# of the calling run and appears under no run of its own. Calling it
# makes "what is tagged is what was tested" true by construction rather
# than by reference.
#
# It used to cost a second full run of the suite on a commit the push
# had already answered for -- measured 4.9.2026, ten minutes of wall
# clock and 2985 s of builder time for an answer that was already in.
# The owner settled that question on 21.9.2026: the evidence is reused
# where it already exists, and only there. A release goes out of main,
# and main is the merge of a pull request whose six checks the branch
# protection wanted green before it could merge. Where the merge
# commit's tree is byte for byte the tree of that pull request's head
# -- nothing else landed on main in between -- the six check runs of
# that head answer for exactly the bytes that are about to be tagged,
# and running them again would say the same thing twelve minutes
# later. So the job "evidence" below asks four questions of the API
# before the suite starts, and the suite job is skipped only where all
# four answer yes. Anywhere else -- main moved, the commit is not a
# merge, a check is missing or not green, the merge brings in a file
# of the speaker separation -- the suite runs here as it has since
# 4.9.2026, and the run says in one line which way it took and why.
#
# "What is tagged is what was tested" stays true on both ways: on the
# long way by construction, on the short way by identity of the tree.
# What the short way gives up is written beside the evidence job.

on:
  # By hand, and by nothing else. A release is a decision, and the one
  # thing in it a machine cannot supply is typed into the box below.
  workflow_dispatch:
    inputs:
      title:
        description: >
          The half sentence after the number, e.g. "the project asks
          before it measures, and stops when told". The number is put
          in front for you.
        required: true
        type: string

# Two releases at once is not a thing that can end well: both would
# read the same version out of the program and race for the same tag.
# And a publish is never cancelled halfway, so the second waits rather
# than killing the first.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  # write, because this run creates the tag and the release. It also
  # covers what the evidence job reads -- a commit's parents and tree,
  # tests.yml at this commit, and the files a merge brings in --
  # because those are contents.
  contents: write
  # write, and read would not do: the last step asks release.yml to
  # answer for what was just published, and starting a run is a write
  # in this scope.
  actions: write
  # read, because the evidence job asks for the check runs of the pull
  # request's head. A check run is neither contents nor an action run;
  # it is its own scope, and a scope not named here is none.
  checks: read
  # read, because step 3b asks the roadmap issue which version it says
  # the program is at. Issues are their own scope as well.
  issues: read

jobs:

  # The title first, in a job of its own, because it is free -- no
  # checkout, no network, no suite. The commonest way to start this
  # wrongly must not cost a full run of six jobs to find out about.
  ready:
    name: "Ready: the title, which no workflow can invent"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TITLE: ${{ inputs.title }}
    steps:

      # ------------------------------------------------------------
      # 0. The title, which no workflow can invent.
      #
      # Empty means stop, and it is worth saying why rather than
      # falling back on the bare number. The release title is the only
      # thing anybody sees in the list of releases before they open
      # something, and the freigabe recipe gives it one job: to say
      # what this version is really about while it does it. A number on
      # its own is not a quieter title, it is a missing one -- and
      # nothing downstream would ever notice, because release.yml holds
      # the notes against the changelog and asks nothing about the
      # headline. So the omission would come out looking like a
      # finished release.
      #
      # Stopping costs one more dispatch, and whoever set this going is
      # standing right there, having just said the word. required: true
      # marks the box in the web form as well, but the API does not
      # enforce it, so the box is not the check -- this is.
      - name: "0. The title, which no workflow can invent"
        run: |
          if [ -z "$(printf '%s' "$TITLE" | tr -d '[:space:]')" ]; then
            echo "FAIL: no title given."
            echo "      The release title is the half sentence after"
            echo "      the number, and it is the only thing anybody"
            echo "      reads in the list of releases before opening"
            echo "      anything. Start this again and say what this"
            echo "      version is about, e.g.:"
            echo "        the project asks before it measures, and stops when told"
            exit 1
          fi
          echo "title: $TITLE"

  # ------------------------------------------------------------
  # 1. The evidence, if it already exists.
  #
  # Four questions, asked of the API and not of a checkout, because
  # the answer is in the commit graph and the check runs and a clone
  # of the whole history is 59.5 MiB for nothing:
  #
  #   a. Is this commit a merge -- does it have two parents?
  #   b. Is its tree the tree of its second parent, the pull request's
  #      head? That is the same question as `git diff --quiet HEAD^2
  #      HEAD`, asked of the tree ids instead: two commits with one
  #      tree id are the same bytes, and a tree that differs anywhere
  #      has a different id. Identical means nothing else landed on
  #      main between the pull request and this dispatch.
  #   c. Did every job of the suite conclude success on that head?
  #      The names are read off tests.yml at this commit and not
  #      written down here: the suite job's name template with the
  #      matrix rows put into it, so a seventh job added there is
  #      asked about without this file being touched. A wanted name
  #      that has no check run, or one whose latest run is anything
  #      but success, is no evidence.
  #   d. Does the merge leave the speaker separation alone? The files
  #      it brings in are the difference between its first parent and
  #      itself, listed by the compare API; one of them, or the name a
  #      renamed one had before, a file of the speaker separation, and
  #      the check runs of c. are no evidence for it -- see the last
  #      paragraph here for what counts as one.
  #
  # Yes to all four and the suite job below is skipped; anything else
  # and it runs as before. GitHub not answering is treated the same
  # way as no: the long way costs twelve minutes, a release stopped
  # for a bad minute at api.github.com costs a second dispatch, and
  # the suite is the safe side. Only tests.yml unreadable at this
  # commit is a fault of its own and stops the run, because a suite
  # whose jobs cannot be named cannot be reused and should not be run
  # blind either.
  #
  # The first build of this file asked the API whether the suite had
  # run on this commit, and that question could never be answered,
  # because a called workflow appears under no run of its own. This
  # one asks about the pull request's head, whose run was a push and
  # does appear -- as six check runs on that commit, named after the
  # six jobs. Measured 21.9.2026 on 8a58ea4, the head of #186: six
  # check runs, "Linux py3.10" to "Windows py3.14", all success, and
  # its tree is the tree of 484daa8, the merge on main.
  #
  # What the short way gives up, written here rather than found later:
  # a push runs the suite with the speaker separation off, and this
  # file turns it on (speaker_split: true, below). The one test that
  # really runs the separation, voice_split_hears_two, therefore runs
  # for a release only on the long way. Nothing in a check run's name
  # says which of the two suites it was, so this job cannot tell and
  # does not pretend to.
  #
  # So the owner decided on 24.9.2026 where that may be given up: only
  # where the merge touches nothing of the separation -- on 24.9.2026
  # that was videopodcast_magic/speakers/, and on 25.9.2026 he widened
  # it to four places: that folder, the model it loads
  # (videopodcast_magic/models/speaker-diarization-*/), requirements.txt,
  # which installs what it runs on, and voice_split_hears_two_test.py,
  # the test that runs it, found by its file name anywhere under tests/
  # because the tests are moving into folders. pyproject.toml is not
  # one of them: its version changes with every release, and counting
  # it would send every release the long way. The four are written
  # once, as patterns, in the step below. A pull request that changed
  # one of them goes the long way, and the line says which file sent
  # it there. The compare API lists at most 300 files and says nothing
  # about any beyond them; a merge that fills that page may hide such
  # a file on the next one, so 300 or more is the long way too, and
  # said so. And as everywhere in this job, GitHub not answering -- or
  # answering something that carries no list of files, or an entry
  # without a file name, which is no list either -- is no, never yes.
  # What stays given up is a change to the separation that lies
  # outside the four -- tests.yml's install of it, or the two voices
  # the test listens to under tests/material/twovoices/.
  evidence:
    name: "Evidence: has this tree been tested already?"
    needs: ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested: ${{ steps.look.outputs.tested }}
      reason: ${{ steps.look.outputs.reason }}
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
    steps:
      - name: "1. The evidence, if it already exists"
        id: look
        run: |
          R="$GITHUB_REPOSITORY"
          short="${SHA:0:7}"
          # One line, the same in the log and in the summary, and the
          # two outputs the jobs below read. The reason is one line by
          # construction -- nothing in it comes from outside this step
          # but commit ids and job names -- and the newline is stripped
          # anyway, because GITHUB_OUTPUT is parsed line by line.
          decide() {
            reason=$(printf '%s' "$2" | tr -d '\r\n')
            if [ "$1" = "true" ]; then way="short"; else way="long"; fi
            echo "tested=$1" >> "$GITHUB_OUTPUT"
            echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo
            echo "way: $way -- $reason"
            echo "way: $way -- $reason" >> "$GITHUB_STEP_SUMMARY"
          }

          # a. Two parents.
          if ! gh api "repos/$R/commits/$SHA" > /tmp/head.json; then
            decide false "GitHub did not answer for $short, so the suite runs here"
            exit 0
          fi
          parents=$(jq -r '.parents | length' /tmp/head.json)
          tree=$(jq -r '.commit.tree.sha' /tmp/head.json)
          if [ "$parents" != "2" ]; then
            decide false "$short has $parents parent(s), not two: it is not the merge of a pull request, so no run of its own tree exists to point at, and the suite runs here"
            exit 0
          fi
          head2=$(jq -r '.parents[1].sha' /tmp/head.json)
          echo "merge:  $SHA"
          echo "head:   $head2 (second parent, the pull request's head)"

          # b. One tree.
          if ! tree2=$(gh api "repos/$R/commits/$head2" \
                         --jq .commit.tree.sha); then
            decide false "GitHub did not answer for ${head2:0:7}, so the suite runs here"
            exit 0
          fi
          echo "tree:   $tree"
          echo "tree':  $tree2"
          if [ "$tree" != "$tree2" ]; then
            decide false "main moved: the tree of $short is not the tree of ${head2:0:7}, so what would be tagged was never tested as it is, and the suite runs here"
            exit 0
          fi

          # c. Every job of the suite, green on that head. The names
          # first, out of tests.yml as it stands at this commit.
          gh api "repos/$R/contents/.github/workflows/tests.yml?ref=$SHA" \
            --jq .content | base64 -d > /tmp/tests.yml
          if ! python3 - /tmp/tests.yml > /tmp/wanted.txt 2> /tmp/why.txt <<'PY'
          import re, sys
          try:
              import yaml
          except ImportError:
              sys.exit("no PyYAML on this runner")
          suite = yaml.safe_load(open(sys.argv[1]))["jobs"]["suite"]
          name = suite["name"]
          for row in suite["strategy"]["matrix"]["include"]:
              print(re.sub(r"\$\{\{\s*matrix\.(\w+)\s*\}\}",
                           lambda m: str(row[m.group(1)]), name))
          PY
          then
            echo "FAIL: tests.yml at $short could not be read for the"
            echo "      names of the suite's jobs: $(cat /tmp/why.txt)"
            echo "      Without them nothing can be held against the"
            echo "      check runs, and a suite that cannot be named"
            echo "      should not be run blind either."
            exit 1
          fi
          n=$(grep -c '' /tmp/wanted.txt || true)
          if [ "$n" = "0" ]; then
            echo "FAIL: tests.yml at $short names no job in its matrix."
            exit 1
          fi

          if ! gh api --paginate "repos/$R/commits/$head2/check-runs" \
                 --jq '.check_runs[] | .name + "\t" + (.conclusion // "unfinished")' \
                 > /tmp/runs.txt; then
            decide false "GitHub did not answer for the check runs of ${head2:0:7}, so the suite runs here"
            exit 0
          fi
          echo "check runs of ${head2:0:7}:"
          sed 's/^/  /' /tmp/runs.txt
          missing=""
          notgreen=""
          while IFS= read -r want; do
            [ -n "$want" ] || continue
            got=$(awk -F'\t' -v w="$want" '$1 == w {print $2}' /tmp/runs.txt)
            if [ -z "$got" ]; then
              missing="$missing '$want'"
            elif printf '%s\n' "$got" | grep -qvx success; then
              notgreen="$notgreen '$want'"
            fi
          done < /tmp/wanted.txt
          if [ -n "$missing$notgreen" ]; then
            decide false "the tree of $short is the tree of ${head2:0:7}, but of its $n jobs these have no check run:${missing:- none}, and these did not conclude success:${notgreen:- none} -- so the suite runs here"
            exit 0
          fi

          # d. Nothing of the speaker separation. The files the merge
          # brings in are its first parent against itself; a renamed
          # file counts under both its names. Every way this can fail
          # -- no answer, no list in the answer, an entry without a file
          # name (jq would print "null" for it, a file nobody has), a
          # list too long to be whole -- is the long way.
          base=$(jq -r '.parents[0].sha' /tmp/head.json)
          if ! gh api "repos/$R/compare/$base...$SHA" > /tmp/compare.json \
             || ! jq -e '.files | type == "array" and all(.[];
                           (.filename | type) == "string"
                           and .filename != "")' /tmp/compare.json \
                    > /dev/null \
             || ! jq -r '.files[] | .filename, (.previous_filename // empty)' \
                    /tmp/compare.json > /tmp/files.txt; then
            decide false "GitHub gave no list of the files ${base:0:7}...$short brings in, so whether the speaker separation changed cannot be told, and the suite runs here"
            exit 0
          fi
          nf=$(jq '.files | length' /tmp/compare.json)
          echo "files:  $nf, brought in by the merge (${base:0:7}...$short)"
          if [ "$nf" -ge 300 ]; then
            decide false "$short brings in $nf files and the compare API lists no more than 300, so a file of the speaker separation may lie beyond them, and the suite runs here"
            exit 0
          fi
          # The separation, as the owner drew it on 25.9.2026: its code,
          # its model, what installs it, the test that runs it by name
          # anywhere under tests/. Not pyproject.toml -- every release
          # moves its version. The only place these four are written.
          cat > /tmp/separation.txt <<'RE'
          ^videopodcast_magic/speakers/
          ^videopodcast_magic/models/speaker-diarization-[^/]*/
          ^requirements\.txt$
          ^tests/(.*/)?voice_split_hears_two_test\.py$
          RE
          echo "separation: $(paste -sd ' ' /tmp/separation.txt)"
          # grep says 1 for no match; anything above is a grep that did
          # not look, and that is no answer -- the long way, not short.
          rc=0
          grep -E -f /tmp/separation.txt /tmp/files.txt > /tmp/hits.txt || rc=$?
          if [ "$rc" -gt 1 ]; then
            decide false "the files ${base:0:7}...$short brings in could not be held against the speaker separation's patterns (grep said $rc), and the suite runs here"
            exit 0
          fi
          LC_ALL=C sort -u /tmp/hits.txt > /tmp/speakers.txt
          if [ -s /tmp/speakers.txt ]; then
            first=$(head -n 1 /tmp/speakers.txt)
            more=$(( $(wc -l < /tmp/speakers.txt) - 1 ))
            if [ "$more" -gt 0 ]; then others=" and $more more of its files"; else others=""; fi
            decide false "the tree of $short is the tree of ${head2:0:7} and its $n check runs are green, but the merge brings in $first$others -- the speaker separation changed and the pull request ran with it off, so the suite runs here with it on"
            exit 0
          fi
          decide true "the tree of $short is the tree of ${head2:0:7}, the head of the pull request it merges, and all $n check runs of that head ($(paste -sd ',' /tmp/wanted.txt | sed 's/,/, /g')) concluded success, and none of the $nf files the merge brings in is a file of the speaker separation -- the suite is not run again"

  # The suite itself, on this very commit, in this very run -- unless
  # the job above found it has already answered for this very tree.
  # It used to be asked of the API whether somebody had run it earlier;
  # running it here says the same thing without the question, and one
  # word does the whole of a release. Red here means no tag, and the
  # six jobs say which of them fell.
  #
  # The condition reads the evidence job's output and nothing else: a
  # job that is skipped here is skipped because that job said "true",
  # and the publish job below holds it to exactly that.
  tests:
    # Short, because it is written in front of every one of the six
    # names below it: "Suite / macOS py3.10" reads, "The suite /
    # macos-latest / py3.14" is cut off before it says anything.
    name: "Suite"
    needs: evidence
    if: needs.evidence.outputs.tested != 'true'
    uses: ./.github/workflows/tests.yml
    # On, and this is the one place it is ever turned on by itself. A
    # push runs the everyday suite; a release answers for the whole
    # program, and cutting by who is speaking is what the program is
    # for -- so the one test that really runs the separation runs here.
    # It costs about two minutes of installing on each of the six jobs.
    #
    # tests.yml defaults it to false, and this says true rather than
    # leaning on that default from the other side: whoever reads this
    # file must be able to see what a release tests without opening
    # the other one.
    with:
      speaker_split: true

  # After the suite, or after the suite was skipped -- and the
  # condition is the whole of the difference, so it is spelled out.
  #
  # Without a condition of its own a job takes the implicit success()
  # of everything it needs, and GitHub counts a skipped job as not
  # successful: a job that needs one is skipped too. That is the right
  # default everywhere else in this file and the wrong one here, so
  # this job says !cancelled() -- which, like always(), takes the
  # implicit success() away and lets the job be looked at when the
  # suite was skipped, but unlike always() does not start a publish
  # inside a run somebody is cancelling.
  #
  # And then it holds the suite to one of exactly two states. success:
  # every one of the six came back green, the way it has been since
  # 4.9.2026. skipped, and only together with the evidence job's own
  # word "true": the suite was not run because the pull request's run
  # on the identical tree stands in for it. A failed suite is neither,
  # a cancelled one is neither, and a suite skipped for any other
  # reason -- the evidence job itself red, say -- is caught by the
  # clause before it, because a job whose needs failed is skipped with
  # its output empty. No tag on any of those.
  publish:
    name: "Publish: the evidence, then the tag"
    needs: [evidence, tests]
    if: >-
      ${{ !cancelled()
          && needs.evidence.result == 'success'
          && (needs.tests.result == 'success'
              || (needs.tests.result == 'skipped'
                  && needs.evidence.outputs.tested == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      # Which way the evidence came, said once more in this job's own
      # log, so whoever opens the job that made the tag reads it there
      # and not only in the job before.
      TESTED: ${{ needs.evidence.outputs.tested }}
      WHY: ${{ needs.evidence.outputs.reason }}
      # The title is somebody's prose, and prose with a backtick in it
      # becomes a command where it is written straight into a shell
      # line. It comes in through the environment, never through
      # ${{ }} inside a run:.
      TITLE: ${{ inputs.title }}
      # Which issue carries the roadmap. One number, in one place, so
      # that moving the roadmap is one edit and not a search.
      ROADMAP: 1
      # The commit this run is about, written down once. Everything
      # below asks about this and about nothing else: the suite's run,
      # the checkout, the tag. A push landing on the branch while this
      # runs changes nothing here.
      SHA: ${{ github.sha }}

    steps:

      # The suite has answered for this tree: either it ran in this
      # very workflow, on this very commit, in the job above, or the
      # evidence job found the pull request's run on the identical
      # tree and said so. Which of the two, in one line, before
      # anything else in this job.
      - name: "1. Which way the evidence came"
        run: |
          if [ "$TESTED" = "true" ]; then
            echo "way: short -- $WHY"
          else
            echo "way: long -- $WHY"
          fi

      - uses: actions/checkout@v5
        with:
          # The commit, not the branch. And the whole history, because
          # the tag is pushed from here: a shallow clone can be refused
          # on a push, and nobody has measured whether a tag-only push
          # is one of the cases where it is. 59.5 MiB of pack (measured
          # 4.9.2026), which is seconds, and once per release.
          ref: ${{ github.sha }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. The version, read out of the program, and the title built
      #    on it.
      #
      # Read, never typed. A number in the dispatch box would be a
      # second place for it to be wrong.
      #
      # pyproject.toml is the reason this step is not just a read.
      # tests/text_release_ready_test.py holds six places against each
      # other -- the program, the changelog, both READMEs, both
      # roadmaps -- and it has run already, on this commit, in step 1.
      # It does not reach pyproject.toml. That seventh place is what
      # pip hands somebody who installs, and a package calling itself
      # one thing while the program calls itself another looks amiss
      # nowhere on the release page.
      #
      # release.yml does hold the two against each other -- letter for
      # letter -- but only once the release is out. Too late: by then
      # the tag is standing. So it is asked here as well, and this is
      # the first of the three places where this file repeats it on
      # purpose.
      #
      # No import, and no tomllib. Importing the program writes
      # bytecode into the package folder -- measured 4.9.2026, eleven
      # files before an import and twenty after -- and the archive four
      # steps down is built out of that folder. The line is read
      # instead. Both files carry exactly one such line (measured
      # 4.9.2026); if a second ever appears, this says so rather than
      # picking one.
      - name: "2. One version number, and the title built on it"
        run: |
          for pair in "videopodcast_magic/__init__.py:^VERSION = \"" \
                      "pyproject.toml:^version = \""; do
            file="${pair%%:*}"
            mark="${pair#*:}"
            n=$(grep -c "$mark" "$file" || true)
            if [ "$n" != "1" ]; then
              echo "FAIL: $file holds $n lines matching $mark, wanted 1."
              exit 1
            fi
          done
          program=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' \
                    videopodcast_magic/__init__.py)
          packed=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "$program" != "$packed" ]; then
            echo "FAIL: the program says '$program', pyproject.toml says"
            echo "      '$packed'. Both are set by hand and they have to"
            echo "      say the same thing before the tag, because after"
            echo "      it nobody can move either."
            exit 1
          fi
          echo "version: $program"

          # The number is put in front here, so the headline and the tag
          # cannot come apart: both are built out of the one number that
          # was just read. What was typed is the half sentence.
          if [ "${TITLE#"$program"}" != "$TITLE" ]; then
            echo "FAIL: the title already starts with the version."
            echo "      Type only the half sentence after the number;"
            echo "      the number is put in front for you. Given:"
            echo "        $TITLE"
            exit 1
          fi
          # Only the two numbers travel on. The title stays in the
          # environment it came in on and is put together where it is
          # used: a line written into GITHUB_ENV is parsed, so somebody
          # else's prose with a newline in it would be setting whatever
          # it liked in the steps below.
          {
            echo "VERSION=$program"
            echo "TAG=v$program"
          } >> "$GITHUB_ENV"
          echo "tag will be:   v$program"
          echo "title will be: $program -- $TITLE"

      # ------------------------------------------------------------
      # 3. The changelog section, cut out and not written again.
      #
      # The recipe's awk, with one change, and the change is why the
      # warning above it in the recipe matters. There the version is
      # typed into the pattern and its dots are escaped by hand
      # (2\.5\.0-beta); here it comes out of a variable, and an
      # unescaped 3.0.0b3 as a regex has three dots that match any
      # character while [ and ] open a character class. So the start is
      # matched as plain text -- index(...) == 1 is "this line begins
      # with these characters" -- and the closing bracket is part of it,
      # so [3.0.0b3] cannot be caught by a section [3.0.0b30].
      #
      # The stop mark is /^## / and not /^## \[/, which is the second
      # half of the recipe's warning: the oldest sections in this file
      # are written "## 0.5.0" without brackets, and awk with the
      # narrower mark reads straight past them to the end of the file.
      # ### inside a section is not matched -- the mark wants a space in
      # the third place.
      #
      # Measured 4.9.2026 against [3.0.0b3]: 92 lines, 4312 bytes,
      # beginning at "### Added" and stopping before "## [3.0.0b2]",
      # with nothing of 3.0.0b2 in it.
      #
      # Whether the section is in both languages and keeps its shape is
      # tests/text_release_ready_test.py's question, and it was green in
      # step 1. What is asked here is only that the cut came out
      # holding something -- the second of the three places this file
      # repeats release.yml on purpose. It holds the release notes
      # against the changelog line for line, so an empty body is
      # certainly found there; but it is found hanging on a tag, and
      # that is too late.
      - name: "3. The changelog section, cut out and not written again"
        run: |
          awk -v want="## [$VERSION]" \
              'index($0, want) == 1 {f = 1; next} /^## /{f = 0} f' \
              CHANGELOG.md > /tmp/notes.md
          if ! grep -q '[^[:space:]]' /tmp/notes.md; then
            echo "FAIL: CHANGELOG.md has no section '## [$VERSION]', or"
            echo "      it is empty -- the cut came to" \
                 "$(wc -c < /tmp/notes.md | tr -d ' ') bytes."
            echo "      The release notes are that section and are"
            echo "      never written a second time, so there is"
            echo "      nothing to publish until it is there."
            exit 1
          fi
          echo "notes: $(wc -l < /tmp/notes.md | tr -d ' ') lines," \
               "$(wc -c < /tmp/notes.md | tr -d ' ') bytes"

      # ------------------------------------------------------------
      # 3b. The roadmap issue names the version that is going out.
      #
      # Of the five things a version needs, four are held by something:
      # the suite by six jobs, the number by six files and a test, the
      # changelog by the step above, the pictures by a pass that is
      # repeatable. The fifth -- that the open list and the roadmap are
      # brought up to date -- was held by a line in a report, and a
      # report nobody grades holds nothing.
      #
      # It has already failed once, and quietly: "Where the program
      # stands today" said 2.24.0-beta while the program was at
      # 2.25.0-beta, and it had drifted two releases with nothing
      # noticing (80f46d5, 1.9.2026).
      #
      # So it is asked here, where a wrong answer costs a run and not a
      # tag. The issue has to say the number BEFORE the tag, the same
      # way the changelog section does -- both describe a version that
      # is about to exist, and both are written by hand while the work
      # is still in the head that did it.
      - name: "3b. The roadmap issue names this version"
        run: |
          body=$(gh issue view "$ROADMAP" --json body --jq .body) || {
            echo "FAIL: issue #$ROADMAP could not be read. It is the"
            echo "      roadmap, and this step is the only thing that"
            echo "      holds it against the program. If the number"
            echo "      moved, say so here rather than turning the"
            echo "      check off."
            exit 1
          }
          if ! printf '%s' "$body" | grep -qF "$VERSION"; then
            echo "FAIL: issue #$ROADMAP does not say $VERSION anywhere."
            echo "      It names: $(printf '%s' "$body" \
                 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.-]*' \
                 | sort -u | tr '\n' ' ')"
            echo "      The roadmap is what somebody outside reads to"
            echo "      find out where this is. Bring it up to date and"
            echo "      dispatch again -- it is two minutes, and it is"
            echo "      one of the five things a version is."
            exit 1
          fi
          echo "roadmap: issue #$ROADMAP names $VERSION"

      # ------------------------------------------------------------
      # 4. The tag does not exist yet.
      #
      # A tag is the one thing here that cannot be taken back once
      # anybody has fetched it. If it is standing already, this run has
      # nothing to do -- either the release was made and this is a
      # second attempt at it, or the number was not raised.
      #
      # Measured 4.9.2026: git ls-remote returns 0 whether the tag is
      # there or not. The answer is the output, not the exit code, and
      # that is what is looked at.
      - name: "4. The tag does not exist yet"
        run: |
          found=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ -n "$found" ]; then
            echo "FAIL: $TAG is already there:"
            echo "      $found"
            echo "      Either this version is out and the number was"
            echo "      not raised, or a run before this one got as far"
            echo "      as the tag. Look at the releases page before"
            echo "      anything is deleted."
            exit 1
          fi
          echo "$TAG is free"

      # ------------------------------------------------------------
      # 5. The archive, and the sum somebody who is not us can check it
      #    by.
      #
      # Straight out of the recipe, exclusions and all. Why the four:
      # the recipe measured it on 4.9.2026 -- zipping the folder
      # plainly comes to 32 085 423 bytes against 593 059 with them.
      # __pycache__ is bytecode that is not in the repository,
      # .DS_Store is a Mac's litter, models/ is 31 MB of speaker model
      # that the program fetches for itself when it first needs it --
      # and the fourth is the one that is a rule rather than tidiness.
      # An uninstalled run writes its log beside the program, so
      # videopodcast_magic/videopodcast-magic.log lies in that folder on
      # any machine the program has been started on, and on the owner's
      # machine that log carries the file names of a real production.
      # .gitignore keeps it out of git; only -x '*.log' keeps it out of
      # here. A fresh checkout has none of the four, and the exclusions
      # stay all the same: the archive says what it is, on any machine
      # it is ever built on.
      #
      # rm -f is not tidiness either: zip adds to an archive that is
      # already there rather than replacing it.
      #
      # From the top of the checkout, so the folder inside is named
      # videopodcast_magic/ and whoever unpacks it has the program
      # ready to start.
      #
      # The sum is over the archive, not over the files in it. An
      # archive cannot be built twice into the same bytes -- it carries
      # the times and the order the files went in -- so a sum over the
      # files would be one nobody could repeat against what is in their
      # hand, while the archive's own sum is exactly that. Made from
      # inside /tmp so the name in the manifest carries no path:
      # release.yml reads it with awk, first field 64 characters, file
      # name last.
      #
      # The listing at the end is the third and last place this file
      # repeats release.yml on purpose. There the archive is held
      # against the tree at the tag, byte for byte, which is the
      # stronger question -- and it can only be asked once the tag
      # exists. Too late: an archive that came out wrong would be found
      # hanging on a tag nobody can move. So the cheap half of it is
      # asked here, both directions at once, with the same prune and
      # the same LC_ALL=C sort on both sides (a Mac's sort and Python's
      # sorted() disagree about punctuation, and two sorters make a
      # difference out of nothing).
      #
      # Measured 4.9.2026 on the working tree: 598 706 bytes, 11 files,
      # and the same 11 that git tracks under videopodcast_magic/
      # outside models/.
      - name: "5. The archive, and the sum to check it by"
        run: |
          rm -f /tmp/videopodcast_magic.zip /tmp/SHA256SUMS.txt
          zip -X -r /tmp/videopodcast_magic.zip videopodcast_magic \
              -x '*/__pycache__/*' '*/.DS_Store' '*.log' \
                 'videopodcast_magic/models/*'
          ( cd /tmp && shasum -a 256 videopodcast_magic.zip \
                       > SHA256SUMS.txt )
          cat /tmp/SHA256SUMS.txt

          find videopodcast_magic -type d \
                 \( -name models -o -name __pycache__ \) -prune \
               -o -type f -print 2>/dev/null \
            | LC_ALL=C sort > /tmp/here.txt
          python3 - /tmp/videopodcast_magic.zip > /tmp/found.txt <<'PY'
          import sys, zipfile
          for name in zipfile.ZipFile(sys.argv[1]).namelist():
              if not name.endswith("/"):
                  print(name)
          PY
          LC_ALL=C sort /tmp/found.txt > /tmp/inside.txt
          # A pattern that matches nothing returns nothing and says
          # nothing about it, so the emptiness is asked about rather
          # than walked past -- an empty listing would hold an empty
          # archive to be perfect.
          if [ ! -s /tmp/here.txt ]; then
            echo "FAIL: no file found under videopodcast_magic/."
            exit 1
          fi
          if ! diff /tmp/here.txt /tmp/inside.txt; then
            echo "FAIL: the archive is not the program."
            echo "      < is at this commit and missing from it,"
            echo "      > is in it and does not belong there."
            echo "      $(wc -l < /tmp/here.txt | tr -d ' ') files here," \
                 "$(wc -l < /tmp/inside.txt | tr -d ' ') in the archive."
            exit 1
          fi
          echo "archive: $(wc -l < /tmp/inside.txt | tr -d ' ') files," \
               "$(wc -c < /tmp/videopodcast_magic.zip | tr -d ' ') bytes"

      # ------------------------------------------------------------
      # 6. The tag, and the release on it.
      #
      # The tag is v plus the version, letter for letter. Not a
      # convention: the program builds the address it fetches its
      # speaker model from out of VERSION that way, so a tag spelled
      # differently sends a fresh installation to an address that is
      # not there.
      #
      # Annotated, like every tag in this repository before it, and
      # made here rather than left to gh: gh would make a lightweight
      # one, and where the tag does not exist yet it would hang it on
      # the default branch's head rather than on the commit the suite
      # answered for. --verify-tag says the release must attach to the
      # tag that is already standing, and --target names the commit for
      # the case where it somehow is not.
      #
      # --latest and no --prerelease: the program asks github.com for
      # the newest release when it looks for an update, and a release
      # that is not the latest is one it never sees.
      #
      # The two together, in one step, because of what half of them
      # would be. A tag with no release behind it is a mark with no
      # evidence attached -- and worse, this run's own step 4 would
      # refuse to make the release on a second attempt, because the tag
      # is now there. So if the release will not be made, the tag goes
      # again, and the next attempt starts from nothing.
      - name: "6. The tag, and the release on it"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "videopodcast-magic $VERSION"
          git push origin "$TAG"
          echo "$TAG pushed, on $SHA"

          if ! gh release create "$TAG" \
                 --verify-tag \
                 --target "$SHA" \
                 --title "$VERSION -- $TITLE" \
                 --notes-file /tmp/notes.md \
                 --latest \
                 /tmp/videopodcast_magic.zip /tmp/SHA256SUMS.txt; then
            echo "FAIL: the release was not made."
            echo "      Taking $TAG down again, so that this can be"
            echo "      started afresh rather than run into its own tag."
            git push origin --delete "$TAG" \
              || echo "      ... and the tag would not go. Remove it by hand."
            exit 1
          fi
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "released: $url"
          {
            echo "## $VERSION -- $TITLE"
            echo
            echo "* tag \`$TAG\` on \`$SHA\`"
            echo "* $url"
            echo "* the archive and \`SHA256SUMS.txt\` hang on it"
            echo
            echo "release.yml now answers for it: the archive against"
            echo "the tree at the tag, the notes against the changelog,"
            echo "and that it installs and starts."
          } >> "$GITHUB_STEP_SUMMARY"

          # Asked for, not waited for. The release above was made with
          # the built-in token, and GitHub raises no workflow run from
          # an event that token caused -- workflow_dispatch is the one
          # exception, and this is it.
          #
          # Without this line the sentence above is a promise nobody
          # keeps: measured 6.9.2026, release.yml last ran for v3.0.0b2
          # and slept through b3, b4 and b5, while every publish said
          # it would answer.
          gh workflow run release.yml -f tag="$TAG"
          echo "release.yml asked for $TAG"
